<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Georrery</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.css"
      integrity="sha512-eqIZI0sGJKWMxBLGcHYg7Tus8jzMu78XcJAPXIlF8P2JP1dFKw5fi7vmOZ3bW8Pk6ae/C4nCxiVF1noCBmOjQQ=="
      crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css"
      integrity="sha512-yAvYFCgl0jKssk1XXo079Ec7sVXfN3OIotWiUP7zTrHhcRxMgRnEFjYhesnBZSfYPkd3sX7BmVTaWQLXvITMnQ=="
      crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/lint.min.css"
      integrity="sha512-bfa1NKQKC/ytQSvZAqmdhn61tSpSyVQ1nkp41fkhDsPeG3jTvd36smZdLYv4Zs7gXHjNwTk0yDvS1nMfVzwwlw=="
      crossorigin="anonymous">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #0f172a;
  }

  header {
    flex: 0 0 auto;
    height: 48px;
    background: #1e293b;
    color: #f1f5f9;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    z-index: 1000;
    overflow: hidden;
  }

  /* Reset, brand, and the Layers dropdown are one rigid strip, wider than
     the header by the Reset button plus one margin. Closed, the strip sits
     shifted left: the button parks exactly offscreen while the title and
     dropdown keep the normal 16px side margins. Open, the whole strip
     slides right - the button lands on the left margin and the dropdown
     slides out of view over the right edge. --header-shift is measured by
     JS (button width + 16px). */
  #header-strip {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 100%;
    padding: 0 16px;
    width: calc(100% + var(--header-shift, 78px));
    transform: translateX(calc(-1 * var(--header-shift, 78px)));
    transition: transform .3s ease;
  }

  header.menu-open #header-strip { transform: translateX(0); }

  #reset-btn {
    border: 1px solid #475569;
    background: #334155;
    color: #f1f5f9;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: .8rem;
    cursor: pointer;
  }

  #reset-btn:hover {
    background: #dc2626;
    border-color: #dc2626;
  }

  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .04em;
    cursor: pointer;
    user-select: none;
  }

  header h1:hover span { color: #7dd3fc; }

  header h1 span { color: #38bdf8; }

  #overlay-select-wrap {
    display: flex;
    align-items: center;
  }

  #overlay-select {
    background: #0f172a;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: .85rem;
    outline: none;
    cursor: pointer;
    max-width: 190px;
  }

  #overlay-select:hover, #overlay-select:focus { border-color: #38bdf8; }

  #overlay-select option, #overlay-select optgroup {
    background: #1e293b;
    color: #f1f5f9;
  }

  /* ---- "+ Data" URL loader ---- */
  /* The input parks tucked under the button's left edge (6px overlap) and
     widens out from behind it when opened; the header clips it at both
     edges, so it never escapes the strip. */
  #data-wrap {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    margin-left: auto; /* parks the button right beside the overlay dropdown */
  }

  #data-btn {
    position: relative; /* paints above the tucked-in input */
    border: 1px solid #475569;
    background: #334155;
    color: #f1f5f9;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: .8rem;
    cursor: pointer;
    white-space: nowrap;
  }

  #data-btn:hover { border-color: #38bdf8; color: #fff; }
  #data-btn:disabled { opacity: .6; cursor: wait; }

  #data-url {
    position: absolute;
    top: 50%;
    right: calc(100% - 6px);
    transform: translateY(-50%);
    width: 0;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: .85rem;
    outline: none;
    opacity: 0;
    pointer-events: none;
    transition: width .3s ease, opacity .2s ease, border-color .15s ease;
  }

  #data-url.open {
    width: min(340px, 40vw);
    opacity: 1;
    pointer-events: auto;
  }

  #data-url:focus { border-color: #38bdf8; }
  #data-url.error { border-color: #dc2626; }

  #map-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }

  #map {
    position: absolute;
    inset: 0;
    /* the right edge pulls in while the text panel is open; --text-panel-w
       is the panel's rendered width, measured by JS (min(90vw, 150ch)
       resolves against the panel's own monospace font) */
    transition: right .3s ease;
    background: #a8c8e0;
  }

  body.text-open #map { right: var(--text-panel-w, 0px); }

  /* ---- GeoJSON panel ---- */
  #panel {
    position: absolute;
    left: 12px;
    /* sits above the Leaflet attribution bar, which is measured live
       (--attribution-h set by JS) since its text can wrap */
    bottom: calc(var(--attribution-h, 16px) + 4px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    height: 46px;
    width: fit-content;
    max-height: calc(100% - var(--attribution-h, 16px) - 36px);
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(6px);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    overflow: hidden;
    transition: width .3s ease, height .3s ease;
  }

  #panel.open {
    height: 50%;
    width: calc(100% - 24px);
  }

  #panel-bar {
    flex: 0 0 auto;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    cursor: pointer;
    user-select: none;
  }

  #panel-bar h2 {
    font-size: 1rem;
    font-weight: 600;
    color: #1e293b;
  }

  #update-btn,
  #nevermind-btn,
  #text-update-btn,
  #text-oops-btn {
    flex: 0 0 auto;
    border: none;
    border-radius: 999px;
    padding: 5px 14px;
    font: 600 .78rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .02em;
    color: #fff;
    background: #0284c7;
    cursor: pointer;
    opacity: 0;
    transform: translateX(8px);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease, background-color .15s ease;
  }

  #nevermind-btn,
  #text-oops-btn { background: #64748b; }

  #update-btn.show,
  #nevermind-btn.show,
  #text-update-btn.show,
  #text-oops-btn.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  #update-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }

  #update-btn:not(:disabled):hover,
  #text-update-btn:hover { background: #0369a1; }
  #nevermind-btn:not(:disabled):hover,
  #text-oops-btn:hover { background: #475569; }

  #panel-status {
    flex: 1 1 auto;
    font-size: .8rem;
    color: #64748b;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* collapsed = compact pill: only the bar, no editor/status internals;
     the Update button keeps its slot while dirty so it stays clickable,
     otherwise it is removed from layout entirely */
  #panel:not(.open) #panel-status { display: none; }
  #panel:not(.open) #panel-body { display: none; }
  #panel:not(.open) #update-btn:not(.show),
  #panel:not(.open) #nevermind-btn:not(.show) { display: none; }

  #panel-status.error { color: #dc2626; font-weight: 600; }

  #chevron {
    flex: 0 0 auto;
    color: #64748b;
    transition: transform .3s ease;
  }

  #panel.open #chevron { transform: rotate(180deg); }

  #panel-body {
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 12px 12px;
  }

  /* ---- CodeMirror ---- */
  .CodeMirror {
    height: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #f8fafc;
    color: #0f172a;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .CodeMirror-focused { border-color: #38bdf8; }

  .CodeMirror-gutters {
    background: #eef2f7;
    border-right: 1px solid #dbe3ec;
  }

  .CodeMirror-linenumber { color: #94a3b8; }

  /* ---- feature details card ---- */
  /* Opens anchored at the clicked feature (a chrome-less Leaflet popup).
     Input edits apply live through the standard map -> text sync; a blank
     input removes the property. Display-only while the GeoJSON text is
     dirty (same body class that hides the Geoman toolbar). */
  .details-card {
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(6px);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    padding: 10px 12px;
    width: 240px;
    font-size: .75rem;
    line-height: 1.4;
    text-align: left;
    color: #1e293b;
  }

  .details-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .details-head button {
    border: none;
    background: none;
    padding: 0 2px;
    font-size: 1rem;
    line-height: 1;
    color: #64748b;
    cursor: pointer;
  }

  .details-head button:hover { color: #dc2626; }

  .details-field {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
  }

  .details-field span { flex: 0 0 58px; color: #64748b; }

  .details-field input {
    flex: 1 1 auto;
    min-width: 0;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 3px 6px;
    font: .75rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f8fafc;
    color: #0f172a;
    outline: none;
  }

  .details-field input:focus { border-color: #38bdf8; }
  .details-field input.invalid { border-color: #dc2626; background: #fef2f2; }

  .details-hint {
    min-height: 14px;
    font-size: .68rem;
    color: #dc2626;
  }

  /* single-line text preview at the bottom of the card: the stored first
     line, grayed and truncated, or the italic word "Text" when empty.
     Clicking toggles the text panel. */
  .details-text {
    display: block;
    width: 100%;
    margin-top: 4px;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    color: #94a3b8;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .details-text.placeholder { font-style: italic; }

  .details-text:hover { color: #64748b; }

  body.geojson-dirty .details-card input,
  body.geojson-dirty .details-text { opacity: .5; pointer-events: none; }
  body.geojson-dirty .details-hint::before {
    content: "Paused - resolve the GeoJSON text first (Update / Never mind)";
    color: #64748b;
  }

  /* strip the default popup chrome around the card */
  .details-popup .leaflet-popup-content-wrapper {
    background: transparent;
    box-shadow: none;
    border-radius: 0;
  }

  .details-popup .leaflet-popup-content { margin: 0; line-height: 1.4; }

  .details-popup .leaflet-popup-tip { display: none; }

  /* ---- feature text panel ---- */
  /* Long free-form "text" property. Slides in from the right over .3s while
     the map's right edge pulls in by the same amount (body.text-open). The
     width tracks the editor font: ~150 characters on desktop, ~90% of the
     viewport on phones. Edits stay local until Update / Oops; closing the
     panel commits pending edits so nothing typed is lost. Not auto-focused. */
  #text-panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(90vw, 150ch);
    z-index: 1100;
    display: flex;
    flex-direction: column;
    background: #f8fafc;
    border-left: 1px solid #cbd5e1;
    box-shadow: -6px 0 24px rgba(0,0,0,.25);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    transform: translateX(100%);
    transition: transform .3s ease;
  }

  #text-panel.open { transform: translateX(0); }

  #text-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px 8px;
    cursor: pointer; /* clicking anywhere above the divider closes the panel */
    user-select: none;
  }

  #text-bar h2 {
    font-size: 1rem;
    font-weight: 600;
    color: #1e293b;
  }

  #text-input {
    flex: 1 1 auto;
    min-height: 0;
    display: block;
    width: 100%;
    resize: none;
    border: none;
    border-top: 1px solid #cbd5e1;
    padding: 10px 12px;
    font: inherit;
    color: #0f172a;
    background: transparent;
    outline: none;
  }

  #text-input[hidden] { display: none; }

  /* Rendered Markdown preview, toggled by the bottom tabs. Proportional type
     for reading; the editor keeps the panel's monospace font. */
  #text-md {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    border-top: 1px solid #cbd5e1;
    padding: 10px 14px;
    font: 14px/1.6 system-ui, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    background: transparent;
  }

  #text-md[hidden] { display: none; }

  #text-md :first-child { margin-top: 0; }

  #text-md h1, #text-md h2, #text-md h3, #text-md h4, #text-md h5, #text-md h6 {
    margin: 1em 0 .4em;
    line-height: 1.3;
    color: #1e293b;
  }

  #text-md h1 { font-size: 1.5em; }
  #text-md h2 { font-size: 1.3em; }
  #text-md h3 { font-size: 1.15em; }

  #text-md p { margin: .5em 0; }

  #text-md ul, #text-md ol { margin: .5em 0; padding-left: 1.6em; }
  #text-md li { margin: .2em 0; }

  #text-md blockquote {
    margin: .6em 0;
    padding: .1em .9em;
    border-left: 3px solid #94a3b8;
    color: #475569;
  }

  #text-md code {
    font: .9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #e2e8f0;
    border-radius: 3px;
    padding: .1em .3em;
  }

  #text-md pre {
    margin: .6em 0;
    padding: .6em .8em;
    background: #e2e8f0;
    border-radius: 6px;
    overflow: auto;
  }

  #text-md pre code { background: none; padding: 0; }

  #text-md a { color: #0369a1; }
  #text-md img { max-width: 100%; }

  #text-md table { border-collapse: collapse; margin: .6em 0; }
  #text-md th, #text-md td { border: 1px solid #cbd5e1; padding: .25em .6em; }

  #text-md hr { border: none; border-top: 1px solid #cbd5e1; margin: 1em 0; }

  /* bottom tab strip: flips the panel between the editor and the preview */
  #text-tabs {
    flex: 0 0 auto;
    display: flex;
    gap: 2px;
    padding: 6px 10px 8px;
    border-top: 1px solid #cbd5e1;
  }

  #text-tabs button {
    border: 1px solid transparent;
    border-radius: 6px;
    background: none;
    padding: 3px 12px;
    font: .75rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #64748b;
    cursor: pointer;
  }

  #text-tabs button:hover { color: #0f172a; background: #e2e8f0; }

  #text-tabs button[aria-selected="true"] {
    background: #e2e8f0;
    border-color: #cbd5e1;
    color: #0f172a;
  }

  /* ---- Geoman toolbar ---- */
  /* While the GeoJSON text has unsaved edits it owns the data: the drawing
     toolbar is hidden and active modes are cancelled (see setGeomanEnabled).
     Panning and zooming stay available - only edits are parked. */
  body.geojson-dirty .leaflet-pm-toolbar { display: none; }

  .range-stack input[type="range"]::-moz-range-track { background: transparent; }

  .time-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 2px;
    color: #64748b;
  }

  /* ---- permanent feature name labels (Leaflet tooltips) ---- */
  .name-label {
    max-width: 240px;
    white-space: pre-line; /* long names wrap instead of stretching the pill */
    background: rgba(255,255,255,.88);
    border: none;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    color: #0f172a;
    font: 600 .7rem/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 1px 5px;
  }

  /* drop the default arrow: labels float free of their anchor point */
  .leaflet-tooltip.name-label::before { display: none; }

  /* ---- time filter card ---- */
  .time-card {
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(6px);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    padding: 8px 10px;
    font-size: .75rem;
    color: #1e293b;
    width: 230px;
  }

  .time-card .time-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .time-card button {
    font-size: .7rem;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
    color: #1e293b;
  }

  .time-card button.active {
    background: #7c3aed;
    border-color: #7c3aed;
    color: #fff;
  }

  .range-stack { position: relative; height: 20px; }

  .range-stack .range-track,
  .range-stack .range-fill {
    position: absolute;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    border-radius: 2px;
    pointer-events: none;
  }

  .range-stack .range-track { left: 0; right: 0; background: #cbd5e1; }
  .range-stack .range-fill { background: #7c3aed; }

  .range-stack input[type="range"] {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 20px;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    pointer-events: none;   /* only the thumbs catch the pointer */
  }

  .range-stack input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    pointer-events: auto;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7c3aed;
    border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    cursor: pointer;
  }

  .range-stack input[type="range"]::-moz-range-thumb {
    pointer-events: auto;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #7c3aed;
    border: 2px solid #fff;
    cursor: pointer;
  }

  /* ---- playback bar (L.timelineSliderControl) ---- */
  /* The control injects its own minimal stylesheet at runtime: a 15%-wide
     floated button column of four empty 8px buttons beside an 80% slider -
     hence the scrunched look. Rebuild it as a two-row card matching the
     .time-card above it: buttons + readout on top, full-width slider below.
     Overrides are scoped with .leaflet-top.leaflet-right so they outrank the
     injected rules (which land after this <style>) without !important. The
     injected .playing class still swaps the play/pause buttons. */
  .leaflet-top.leaflet-right .leaflet-timeline-control {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 230px;
    margin: 0 10px 0 0;
    padding: 8px 10px;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(6px);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .sldr-ctrl-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    float: none;
    width: 100%;
  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button {
    position: relative;
    width: 26px;
    height: 22px;
    padding: 0;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #f8fafc;
    cursor: pointer;
  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button:hover {
    background: #ede9fe;
    border-color: #7c3aed;
  }

  /* glyphs: the buttons ship empty; anchor both pseudos dead center and
     draw the icons with border triangles (dark slate, like .time-card) */
  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button::before,
  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border: 0 solid transparent;
  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.play::before {
    border-width: 7px 0 7px 10px;
    border-left-color: #1e293b;
    margin: -7px 0 0 -5px;
  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.pause::before {
    width: 3px;
    height: 13px;
    background: #1e293b;
    box-shadow: 6px 0 0 #1e293b;
    margin: -6.5px 0 0 -4.5px;
  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.prev::before,
  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.next::before {
    width: 2px;

  }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.prev::before { margin: -6.5px 0 0 -6.5px; }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.prev::after {

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.next::before { margin: -6.5px 0 0 4.5px; }

  .leaflet-top.leaflet-right .leaflet-timeline-control .button-container button.next::after {
    border-width: 6.5px 0 6.5px 9px;
    border-left-color: #1e293b;
    margin: -6.5px 0 0 -4.5px;

  .leaflet-top.leaflet-right .leaflet-timeline-control input.time-slider {
    width: 100%;
    margin: 0;

  .leaflet-top.leaflet-right .leaflet-timeline-control .time-text {
