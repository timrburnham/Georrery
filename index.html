  /* fallback when CodeMirror fails to load */
  #geojson-input {
    width: 100%;
    height: 100%;
    resize: none;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #0f172a;
    background: #f8fafc;
    outline: none;
  }
</style>
</head>
<body>

<header>
  <div id="header-strip">
    <button type="button" id="reset-btn" title="Clear all locally stored data and the GeoJSON text">Reset</button>
    <h1 id="brand" title="Show menu">Geo<span>rrery</span></h1>
    <div id="data-wrap">
      <button type="button" id="data-btn" title="Load GeoJSON from a URL">+ Data</button>
      <input id="data-url" type="url" placeholder="Paste a GeoJSON / .map URL"
             aria-label="GeoJSON URL" autocomplete="off" spellcheck="false">
    </div>
    <div id="overlay-select-wrap">
      <select id="overlay-select" aria-label="Map overlay">
        <option value="">No Overlay</option>
        <optgroup label="Waymarked Trails">
          <option value="wmt-hiking">Hiking routes</option>
          <option value="wmt-cycling">Cycling routes</option>
          <option value="wmt-mtb">MTB routes</option>
          <option value="wmt-skating">Skating routes</option>
          <option value="wmt-riding">Riding routes</option>
          <option value="wmt-winter">Winter routes</option>
        </optgroup>
        <optgroup label="OpenSeaMap">
          <option value="oseam-seamark">Sea marks</option>
        </optgroup>
      </select>
    </div>
  </div>
</header>

<div id="map-wrap">
  <div id="map"></div>

  <div id="panel">
    <div id="panel-bar" title="Toggle GeoJSON panel">
      <h2>GeoJSON</h2>
      <button id="update-btn" type="button" title="Render edited GeoJSON onto the map">Update</button>
      <button id="nevermind-btn" type="button" title="Discard edits and restore the saved GeoJSON">Never mind</button>
      <div id="panel-status"></div>
      <span id="chevron">&#9650;</span>
    </div>
    <div id="panel-body">
      <textarea id="geojson-input" spellcheck="false"></textarea>
    </div>
  </div>

  <div id="text-panel">
    <div id="text-bar" title="Close the text panel">
      <h2 id="text-title">Text</h2>
      <button id="text-update-btn" type="button" title="Save the text onto the feature">Update</button>
      <button id="text-oops-btn" type="button" title="Discard unsaved text edits">Oops</button>
    </div>
    <textarea id="text-input" spellcheck="false" aria-label="Feature text" placeholder="Free-form text"></textarea>
    <div id="text-md" hidden aria-label="Rendered Markdown preview"></div>
    <div id="text-tabs" role="tablist" aria-label="Text panel view">
      <button id="text-tab-edit" type="button" role="tab" aria-selected="true"
              title="Edit the raw text">Edit</button>
      <button id="text-tab-preview" type="button" role="tab" aria-selected="false"
              title="Render the text as Markdown">Preview</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.js"
        integrity="sha512-BiIrkmwG5bdOa1AWTMFAI9I5ab/qQd6tdhQLEmawFYfT0YlR77V/l2Jvel3k8hA45PwV9V4JcXC6TjDFkSV1XA=="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.timeline@1.6.0/dist/leaflet.timeline.js"
        integrity="sha512-jGt9VJboJ1EExMlEDjqoZRZ2Te57YYG6iFs4grBsSzbV5bytERwY+Hh6fff4k/xZmTgPbk+xZfmMyYH6mg47Dw=="
        crossorigin="anonymous"></script>
<!-- cdnjs's precompressed brotli copy of codemirror.min.js 5.65.21 is out of sync
     (different bytes than the plain file), which breaks SRI in browsers that
     negotiate brotli - this file is served from jsDelivr instead. -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.min.js"
        integrity="sha512-XF1G4hLzXBiQrxOjvhSYHCNoeDIXsDOJtqZMOptZwQtL84qN4iswdD7OJ42iCoxVLppfokVmPl/9UZKWQcFh/w=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/javascript/javascript.min.js"
        integrity="sha512-k1xN8Ok3EjJVqkyue+rrYB9WJi34a101SAdtjJGS4sM0ZSFTb7IBseqeCL4OcKzmQRmtrKIYqVROZYIpHXc3Mg=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsonlint/1.6.0/jsonlint.min.js"
        integrity="sha512-6qbnCNQe7wVcBDvhNJT6lZsbDKHCQQBk7yOBQg4s/9GG812CknK0EEIqG2IS10XuNxIQNWjMJd6VLwwezICz6w=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/lint.min.js"
        integrity="sha512-lXcl97MDW/i/BsKkQ6J4M3iSNyIpGyEdbIZTMM77cwtxoDZDABxH/7n3G3Sidx/Bjrpa1KrX8dfNPnAqafQjmw=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/json-lint.min.js"
        integrity="sha512-r8rxpmeeEUAdIovyAOYwk1/kb4vK4wGk5aAj+30blS6DoLJyNKrukS483cLXgFoTV3JGpkFH6r0kKZWiRiut/A=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/closebrackets.min.js"
        integrity="sha512-rijIQfP2KYlfTjFMjJg33a5fVUsZbLsy6fLSCZsM1jNI35n4xl1cBiIjxK5tANQYPWqa1niMYK5lWn2CTSUPKw=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/matchbrackets.min.js"
        integrity="sha512-ynfHqOx3h/V0CDEdHKHdS4C0Kp5tcpILVbUOqNczDbRDiKqrMx3mONwyFHcMmOs43MMiGfD9gDjbvnQ5fOZxvw=="
        crossorigin="anonymous"></script>
<!-- Markdown preview for the feature Text panel: marked renders to HTML and
     DOMPurify sanitizes it (marked passes raw HTML through by design - its
     documented pairing). UMD globals; the preview tab degrades to escaped
     plain text if either fails to load. -->
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.umd.js"
        integrity="sha384-N2BlPYJH0HRuJRIZOGNTL/ymqHb++FCViUqW4rdB5/7fH+KvFTqyCvPPQ8X4nElj"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"
        integrity="sha384-46dPGH1XlTmj7bc50bqLjTdORXs/3EP2QpA/6EWbelYWOY9VGp+87RT61S3Mcslb"
        crossorigin="anonymous"></script>
<script>
(() => {
  "use strict";

  // LocalStorage keys - one topic per key, "georrery.<topic>" naming.
  const GEOJSON_STORAGE_KEY = "georrery.geojson"; // editor contents
  const OVERLAY_STORAGE_KEY = "georrery.overlay"; // selected map overlay
  const VIEW_STORAGE_KEY = "georrery.view";       // last map position + zoom

  const EMPTY_GEOJSON_TEXT = JSON.stringify({ type: "FeatureCollection", features: [] }, null, 2);

  const map = L.map("map", { worldCopyJump: true }).setView([20, 0], 2);

  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    maxZoom: 17,
    attribution:
      'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
      '<a href="http://viewfinderpanoramas.org">SRTM</a> | ' +
      'Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> ' +
      '(<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
  }).addTo(map);

  const panel = document.getElementById("panel");
  const panelBar = document.getElementById("panel-bar");
  const statusEl = document.getElementById("panel-status");
  const updateBtn = document.getElementById("update-btn");
  const neverMindBtn = document.getElementById("nevermind-btn");
  const textarea = document.getElementById("geojson-input");
  const brand = document.getElementById("brand");
  const header = document.querySelector("header");
  const resetBtn = document.getElementById("reset-btn");

  let dataLayer = null;       // the FeatureCollection currently drawn on the map
  let lastRendered = null;    // editor text that matches what the map shows
  let cm = null;              // CodeMirror instance (null -> plain textarea fallback)
  let syncingFromMap = false; // suppresses onEdit during programmatic setValue
  let statusTimer = 0;
  let viewSaveTimer = 0;
  let mapSyncTimer = 0;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    // toggle(token, undefined) FLIPS in Firefox - an omitted error flag must
    // clear the class, never toggle it
    statusEl.classList.toggle("error", Boolean(isError));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- permanent "name" labels on the shapes ----
  // Rendered beside points and centered on lines, polygons, and multi-part
  // features. Tooltips are pointer-events:none, so clicks fall through to
  // the shape (details card) underneath. Tooltip content goes through
  // innerHTML, so names are HTML-escaped. Labels live on the working layers
  // only - during playback a copy sits on top of its hidden working original
  // and would duplicate the label.
  function hasName(feature) {
    const n = feature && feature.properties && feature.properties.name;
    return n != null && String(n).trim() !== "";
  }

  function nameLabelOptions(layer) {
    // LineString/Polygon render as L.Polyline; Multi* parts arrive as a
    // (Feature)Group - both get a centered label. Everything else is a
    // point: direction "auto" hugs the marker and flips at map edges.
    const centered = layer instanceof L.Polyline || layer instanceof L.LayerGroup;
    return centered
      ? { permanent: true, direction: "center", className: "name-label" }
      : { permanent: true, offset: [10, 0], className: "name-label" };
  }

  function bindNameLabel(feature, layer) {
    if (!hasName(feature) || !layer.bindTooltip) { return; }
    layer.bindTooltip(escapeHtml(String(feature.properties.name)), nameLabelOptions(layer));
  }

  // Keeps a layer's label in step: name edits from the details card
  // (add / rename / clear) and first-time labels on freshly drawn shapes.
  function syncNameLabel(layer) {
    if (!layer.bindTooltip) { return; }
    const tooltip = layer.getTooltip();
    if (hasName(layer.feature)) {
      if (tooltip) { layer.setTooltipContent(escapeHtml(String(layer.feature.properties.name))); }
      else { bindNameLabel(layer.feature, layer); }
    } else if (tooltip) {
      layer.unbindTooltip();
    }
  }

  // Shared L.GeoJSON / L.timeline options; wireGeoman adds the map-edit
  // sync plus the permanent name labels (working layers only).
  function layerOptions(color, wireGeoman) {
    return {
      style: () => ({ color, weight: 2, fillOpacity: 0.25 }),
      pointToLayer: (_feature, latlng) => L.circleMarker(latlng, { radius: 6, color, weight: 2, fillOpacity: 0.5 }),
      onEachFeature: (feature, layer) => {
        if (wireGeoman) {
          wireGeomanSync(layer);
          bindNameLabel(feature, layer);
        } else {
          // Playback copies open the same Facts card as working shapes; the
          // feature object is shared with the working layer, so card edits
          // land on the real data and ride the usual map -> text sync.
          layer.__playback = true;
          layer.on("click", e => selectFeature(layer, e.latlng));
        }
      }
    };
  }

  function renderData(data) {
    closeDetails(); // the layer set is rebuilt - drop any open selection
    if (dataLayer) {
      map.removeLayer(dataLayer);
      dataLayer = null;
    }
    dataLayer = L.geoJSON(data, layerOptions("#0284c7", true)).addTo(map);
    rebuildTimeIndex();
    if (playbackOn) { setPlayback(true); } // rebuild playback from fresh layers
  }

  // ---- Keep the GeoJSON panel clear of the attribution bar ----
  // The attribution bar (bottom-right of the map) can wrap to several lines
  // on narrow screens or when overlay attributions are active, so measure it.
  const attributionEl = map.attributionControl.getContainer();
  const syncAttributionHeight = () =>
    document.documentElement.style.setProperty("--attribution-h", `${attributionEl.offsetHeight}px`);
  syncAttributionHeight();
  if (window.ResizeObserver) {
    new ResizeObserver(syncAttributionHeight).observe(attributionEl);
  } else {
    window.addEventListener("resize", syncAttributionHeight);
  }

  // ---- Remembered map view ----
  // Saved a few seconds after you stop moving - never live per-frame/pan-step.
  function saveView() {
    try {
      const c = map.getCenter();
      localStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify({
        lat: Math.round(c.lat * 1e5) / 1e5,
        lng: Math.round(c.lng * 1e5) / 1e5,
        zoom: map.getZoom()
      }));
    } catch { /* ignore */ }
  }

  try {
    const v = JSON.parse(localStorage.getItem(VIEW_STORAGE_KEY));
    if (v && isFinite(v.lat) && isFinite(v.lng) && isFinite(v.zoom)) {
      map.setView([v.lat, v.lng], Math.max(0, Math.min(17, Math.round(v.zoom))), { animate: false });
    }
  } catch { /* no saved view yet? the constructor's world view stands */ }

  map.on("moveend zoomend", () => {
    clearTimeout(viewSaveTimer);
    viewSaveTimer = setTimeout(saveView, 3000); // one write per settled view
  });

  // ---- Overlay selection (header drop-down, single choice) ----
  const WMT_ATTRIBUTION =
    "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)";
  const OVERLAYS = {};
  for (const trail of ["hiking", "cycling", "mtb", "skating", "riding", "winter"]) {
    OVERLAYS[`wmt-${trail}`] = {
      url: `https://tile.waymarkedtrails.org/${trail}/{z}/{x}/{y}.png`,
      maxZoom: 18,
      attribution: WMT_ATTRIBUTION
    };
  }
  OVERLAYS["oseam-seamark"] = {
    url: "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
    maxZoom: 18,
    attribution: "Sea marks: &copy; <a href='https://openseamap.org'>OpenSeaMap</a> contributors (CC-BY-SA)"
  };

  const overlaySelect = document.getElementById("overlay-select");
  let activeOverlay = null;

  function setOverlay(id) {
    if (activeOverlay) {
      map.removeLayer(activeOverlay);
      activeOverlay = null;
    }
    const def = OVERLAYS[id];
    if (def) {
      activeOverlay = L.tileLayer(def.url, {
        maxZoom: def.maxZoom,
        opacity: 0.9,
        attribution: def.attribution
      }).addTo(map);
    }
    try { localStorage.setItem(OVERLAY_STORAGE_KEY, id || ""); } catch { /* ignore */ }
  }

  overlaySelect.addEventListener("change", () => setOverlay(overlaySelect.value));

  let savedOverlay = "";
  try { savedOverlay = localStorage.getItem(OVERLAY_STORAGE_KEY) || ""; } catch { /* ignore */ }
  if (!OVERLAYS[savedOverlay]) { savedOverlay = ""; }
  overlaySelect.value = savedOverlay;
  if (savedOverlay) { setOverlay(savedOverlay); }

  // ---- "+ Data": load GeoJSON from a URL into the current context ----
  // The input parks behind the button and widens out on click; the same
  // button (or Enter) submits, Escape closes. The fetched features are
  // appended to the editor's FeatureCollection, rendered, and saved - the
  // same context the editor and Geoman draw from. MediaWiki "Data:" pages
  // render HTML around the JSON, so their URLs are pulled through the API
  // (cross-origin via origin=*); raw .geojson / .map URLs fetch directly.
  const dataBtn = document.getElementById("data-btn");
  const dataUrlInput = document.getElementById("data-url");

  function openDataBox() {
    dataUrlInput.classList.add("open");
    dataUrlInput.classList.remove("error");
    dataUrlInput.title = "";
    dataUrlInput.focus();
    dataUrlInput.select(); // a second open types over the previous URL
  }

  function closeDataBox() {
    dataUrlInput.classList.remove("open");
    dataUrlInput.blur();
  }

  // Accepts a bare FeatureCollection, a single Feature, a GeometryCollection,
  // an array of features, or a WikiMap .map file (the GeoJSON hides under a
  // "data" property, feature names live in "title" -> mapped to "name").
  function normalizeFeatures(data) {
    if (data && typeof data === "object" && !Array.isArray(data) &&
        data.data && !data.type) {
      data = data.data;
    }
    let features = null;
    if (Array.isArray(data)) {
      features = data;
    } else if (data && data.type === "FeatureCollection" && Array.isArray(data.features)) {
      features = data.features;
    } else if (data && data.type === "Feature") {
      features = [data];
    } else if (data && data.type === "GeometryCollection" && Array.isArray(data.geometries)) {
      features = data.geometries.map(g => ({ type: "Feature", properties: {}, geometry: g }));
    }
    if (!features) { return null; }
    return features.map(f => {
      if (!f || f.type !== "Feature") { return null; }
      const props = f.properties || (f.properties = {});
      if (props.name == null && props.title != null) { props.name = props.title; }
      return f;
    }).filter(Boolean);
  }

  async function loadDataFromUrl(rawUrl) {
    let url = String(rawUrl).trim();
    if (!url) { return []; }
    const mw = /^https?:\/\/commons\.wikimedia\.org\/wiki\/(Data:[^?#\s]+)/i.exec(url);
    let viaApi = false;
    if (mw) {
      viaApi = true;
      url = "https://commons.wikimedia.org/w/api.php?action=query&format=json" +
        "&formatversion=2&origin=*&prop=revisions&rvprop=content&rvslots=main" +
        "&titles=" + encodeURIComponent(mw[1]);
    }
    const res = await fetch(url, { mode: "cors" });
    if (!res.ok) { throw new Error(`HTTP ${res.status}`); }
    let text = await res.text();
    if (viaApi) {
      const j = JSON.parse(text);
      const page = j.query && j.query.pages && j.query.pages[0];
      if (!page || page.missing) { throw new Error("Data page not found"); }
      const content = page.revisions && page.revisions[0] &&
        page.revisions[0].slots.main.content;
      if (!content) { throw new Error("Data page has no content"); }
      text = content;
    }
    let data;
    try { data = JSON.parse(text); }
    catch {
      // the MediaWiki API sometimes percent-encodes page content
      try { data = JSON.parse(decodeURIComponent(text)); }
      catch { throw new Error("Response is not valid JSON"); }
    }
    const features = normalizeFeatures(data);
    if (!features) { throw new Error("No GeoJSON features in the response"); }
    return features;
  }

  function submitDataUrl() {
    const url = dataUrlInput.value.trim();
    if (!url) { closeDataBox(); return; }
    const host = (() => { try { return new URL(url).hostname; } catch { return "URL"; } })();
    dataBtn.disabled = true;
    loadDataFromUrl(url)
      .then(features => {
        // merge into the GeoJSON context: editor text, map, storage
        const r = parseEditor();
        let base = r.ok ? r.data : (dataLayer ? dataLayer.toGeoJSON() : null);
        if (!base || base.type !== "FeatureCollection") {
          base = { type: "FeatureCollection", features: [] };
        }
        const merged = { type: "FeatureCollection", features: base.features.slice().concat(features) };
        const text = JSON.stringify(merged, null, 2);
        setEditorText(text);
        renderData(merged);
        lastRendered = text;
        saveNow();
        refreshStatus();
        setStatus(`Loaded ${features.length} feature${features.length === 1 ? "" : "s"} from ${host}`);
        // bring the freshly loaded data into view (the merged set may be
        // scattered across the globe; the new features define the frame)
        const bounds = dataLayer.getBounds();
        if (bounds.isValid()) { map.fitBounds(bounds, { padding: [24, 24], maxZoom: 13 }); }
        dataUrlInput.value = "";
        closeDataBox();
      })
      .catch(err => {
        dataUrlInput.classList.add("error");
        dataUrlInput.title = err.message || String(err);
        setStatus(`Load failed: ${err.message || err}`, true);
      })
      .finally(() => { dataBtn.disabled = false; });
  }

  dataBtn.addEventListener("click", () => {
    if (dataUrlInput.classList.contains("open")) {
      if (dataUrlInput.value.trim()) { submitDataUrl(); } else { closeDataBox(); }
    } else {
      openDataBox();
    }
  });

  dataUrlInput.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); submitDataUrl(); }
    else if (e.key === "Escape") { e.preventDefault(); closeDataBox(); }
  });

  dataUrlInput.addEventListener("input", () => {
    dataUrlInput.classList.remove("error"); // typing clears the failure state
    dataUrlInput.title = "";
  });

  function parseEditor() {
    const text = editorValue();
    try { return { ok: true, data: JSON.parse(text), text }; }
    catch (e) { return { ok: false, error: e.message, text }; }
  }

  function loadSavedText() {
    try { return localStorage.getItem(GEOJSON_STORAGE_KEY); } catch { return null; }
  }

  function saveNow() {
    try { localStorage.setItem(GEOJSON_STORAGE_KEY, editorValue()); } catch { /* storage full/unavailable */ }
  }

  function refreshStatus() {
    const r = parseEditor();
    const dirty = r.text !== lastRendered;
    updateBtn.classList.toggle("show", dirty);
    neverMindBtn.classList.toggle("show", dirty);
    updateBtn.disabled = !r.ok;
    setGeomanEnabled(!dirty);
    if (!r.ok) {
      setStatus(`Invalid JSON: ${r.error}`, true);
      return;
    }
    const n = r.data.type === "FeatureCollection" && Array.isArray(r.data.features) ? r.data.features.length : 1;
    setStatus(`${n} feature${n === 1 ? "" : "s"}${dirty ? " \u00b7 unsaved" : " rendered"}`);
  }

  function onEdit() {
    if (syncingFromMap) { return; } // map-originated; setEditorText owns the state
    setGeomanEnabled(false);        // dirty text owns the data until Update / Never mind
    clearTimeout(statusTimer);
    statusTimer = setTimeout(refreshStatus, 300); // live validation; the text saves via Update / map sync only
  }

  // ---- Temporal features: fuzzy-date popups, range filter, playback ----
  // Time lives in properties as ISO 8601 / EDTF strings: "datetime" for an
  // instant ("1920", "2020-03~") or "start"/"end" for a range ("../.." open
  // bounds allowed). RFC 7946 lets properties hold arbitrary JSON; EDTF is
  // the Library of Congress fuzzy-date spec (ISO 8601-2 profile).
  const MIN_MS = -62135596800000;  // year 1
  const MAX_MS = 253402300799999;  // year 9999
  let timeIndex = null;
  let playbackOn = false;
  let tlLayer = null;
  let tlControl = null;
  const timeUI = {};
  const timeFilter = { lo: MIN_MS, hi: MAX_MS };

  // Level-0 fallback: "YYYY", "YYYY-MM", "YYYY-MM-DD" and "a/b" intervals.
  let parseEdtf = s => {
    const one = t => {
      const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(t);
      if (!m) { return null; }
      const y = +m[1];
      if (!m[2]) { return { min: Date.UTC(y, 0, 1), max: Date.UTC(y, 11, 31, 23, 59, 59, 999) }; }
      if (!m[3]) { return { min: Date.UTC(y, m[2] - 1, 1), max: Date.UTC(y, m[2], 0, 23, 59, 59, 999) }; }
      const ms = Date.UTC(y, m[2] - 1, m[3]);
      return { min: ms, max: ms + 86399999 };
    };
    s = String(s).trim();
    const parts = s.split("/");
    if (parts.length === 1) { return one(parts[0]); }
    const a = (parts[0] === "" || parts[0] === "..") ? null : one(parts[0]);
    const b = (parts[1] === "" || parts[1] === "..") ? null : one(parts[1]);
    if (!a && !b) { return null; }
    return { min: a ? a.min : -Infinity, max: b ? b.max : Infinity };
  };

  // Upgrade to full EDTF (fuzzy "2020~", "200X", "?" uncertainty, ...) when
  // the library is reachable; the fallback parser keeps the app usable offline.
  import("https://cdn.jsdelivr.net/npm/edtf@4/+esm")
    .then(mod => {
      const edtf = mod.default || mod.edtf;
      if (typeof edtf !== "function") { return; }
      parseEdtf = s => {
        try {
          const d = edtf(String(s));
          if (!d || d.min == null || d.max == null) { return null; }
          return { min: +d.min, max: +d.max };
        } catch { return null; }
      };
      rebuildTimeIndex();   // re-index with full fuzz support
      if (playbackOn) { setPlayback(true); }
    })
    .catch(() => { /* keep the fallback parser */ });

  const clampMs = ms => Math.min(Math.max(ms, MIN_MS), MAX_MS);

  function featureInterval(props) {
    const one = v => {
      if (v == null || v === "") { return null; }
      if (typeof v === "number" && isFinite(v)) { return { min: v, max: v }; }
      const r = parseEdtf(v);
      return r ? { min: clampMs(r.min), max: clampMs(r.max) } : null;
    };
    const dt = one(props.datetime);
    if (dt) { return dt; }
    const s = one(props.start);
    const e = one(props.end);
    if (!s && !e) { return null; }
    return { min: s ? s.min : e.min, max: e ? e.max : s.max };
  }

  function setVisible(layer, visible) {
    // Permanent labels are their own map layer, so they must follow the
    // shape's visibility; openTooltip() also re-anchors after edits.
    if (layer.getTooltip && layer.getTooltip()) {
      if (visible && map.hasLayer(layer)) { layer.openTooltip(); }
      else { layer.closeTooltip(); }
    }
    if (layer.getLayers) {          // Multi* geometries arrive as groups
      layer.getLayers().forEach(l => setVisible(l, visible));
      return;
    }
    const el = layer.getElement && layer.getElement();
    if (el) { el.style.display = visible ? "" : "none"; }
  }

  function formatMs(ms) {
    if (!isFinite(ms)) { return "..."; }
    const d = new Date(ms);
    const span = timeIndex ? timeIndex.max - timeIndex.min : 0;
    if (span > 3 * 366 * 864e5) { return String(d.getUTCFullYear()); }
    return d.toISOString().slice(0, 10);
  }

  function updateTimeFilterUI() {
    if (!timeIndex || !timeIndex.items.length || !timeUI.card) { return; }
    const span = timeIndex.max - timeIndex.min;
    const lo = timeIndex.min + (+timeUI.lo.value * span) / 1000;
    const hi = timeIndex.min + (+timeUI.hi.value * span) / 1000;
    timeFilter.lo = lo;
    timeFilter.hi = hi;
    const spanPct = Math.max(1, span);
    timeUI.fill.style.left = `${(100 * (lo - timeIndex.min)) / spanPct}%`;
    timeUI.fill.style.right = `${100 - (100 * (hi - timeIndex.min)) / spanPct}%`;
    timeUI.loLabel.textContent = formatMs(lo);
    timeUI.hiLabel.textContent = formatMs(hi);
    applyTimeFilter();
  }

  function onRangeInput(e) {
    const lo = +timeUI.lo.value;
    const hi = +timeUI.hi.value;
    if (lo > hi) { e.target.value = e.target === timeUI.lo ? hi : lo; }
    updateTimeFilterUI();
  }

  function applyTimeFilter() {
    if (!timeIndex) { return; }
    dataLayer.getLayers().forEach(layer => {
      const iv = timeIndex.byLayer.get(layer);
      // during playback the timeline layer owns the temporal features
      const visible = iv ? !playbackOn && iv.min <= timeFilter.hi && iv.max >= timeFilter.lo : true;
      setVisible(layer, visible);
    });
  }

  function rebuildTimeIndex() {
    const prevMin = timeIndex ? timeIndex.min : null;
    const prevMax = timeIndex ? timeIndex.max : null;
    timeIndex = { items: [], byLayer: new Map(), min: Infinity, max: -Infinity };
    if (!dataLayer) { return; }
    dataLayer.getLayers().forEach(layer => {
      const f = layer.feature || null;
      const iv = f ? featureInterval(f.properties || {}) : null;
      timeIndex.byLayer.set(layer, iv);
      if (f && iv) {
        f.__interval = iv; // read back by L.timeline's getInterval
        // Redshift candidate: a true start/end range (not a datetime
        // instant, not an open-ended range)
        f.__range = Boolean((f.properties || {}).start && (f.properties || {}).end);
        timeIndex.items.push({ layer, feature: f, interval: iv });
        if (iv.min < timeIndex.min) { timeIndex.min = iv.min; }
        if (iv.max > timeIndex.max) { timeIndex.max = iv.max; }
      }
    });
    const has = timeIndex.items.length > 0;
    timeUI.card.style.display = has ? "" : "none";
    if (has) {
      if (timeIndex.min !== prevMin || timeIndex.max !== prevMax) {
        timeUI.lo.value = 0;      // domain changed -> reset the filter window
        timeUI.hi.value = 1000;
      }
      updateTimeFilterUI();
    } else if (playbackOn) {
      setPlayback(false);
    }
  }

  // ---- Redshift: range features sweep the spectrum across their lifetime ----
  // While playback runs, features carrying both "start" and "end" are
  // colored by how far the playhead is through their own interval (a
  // "datetime" alongside start/end is ignored - the range drives it).
  // Hue walks the visible spectrum from bright red (0deg) through orange,
  // yellow, green, and cyan to just-barely violet past blue; instants and
  // open ranges keep the static playback color.
  const REDSHIFT_MAX_HUE = 260; // pure blue is 240; 260 barely tips into violet

  function redshiftColor(min, max, t) {
    const p = max > min ? Math.min(Math.max((t - min) / (max - min), 0), 1) : 0;
    return `hsl(${Math.round(p * REDSHIFT_MAX_HUE)}, 100%, 50%)`;
  }

  function applyRedshift(t) {
    if (!tlLayer) { return; }
    tlLayer.eachLayer(layer => {
      const f = layer.feature;
      if (f && f.__range && f.__interval) {
        layer.setStyle({ color: redshiftColor(f.__interval.min, f.__interval.max, t) });
      }
    });
  }

  function setPlayback(on) {
    playbackOn = on;
    if (tlControl) { map.removeControl(tlControl); tlControl = null; }
    if (tlLayer) { map.removeLayer(tlLayer); tlLayer = null; }
    if (on && timeIndex && timeIndex.items.length) {
      // Pad the playhead domain past the data so the bar can be parked
      // before or after everything and filter the map empty either way.
      const span = timeIndex.max - timeIndex.min;
      const pad = span > 0 ? span * 0.05 : 3.156e10; // 5% of span, or ~1 year
      const fc = {
        type: "FeatureCollection",
        features: timeIndex.items.map(item => item.feature)
      };
      tlLayer = L.timeline(fc, Object.assign(layerOptions("#7c3aed", false), {
        pmIgnore: true,           // keep Geoman off the playback copies
        start: timeIndex.min - pad,
        end: timeIndex.max + pad,
        getInterval: f => f.__interval ? { start: f.__interval.min, end: f.__interval.max } : false
      }));
      tlLayer.on("change", () => applyRedshift(tlLayer.time)); // every tick, after the reveal
      tlControl = L.timelineSliderControl({
        position: "topright",
        formatOutput: formatMs,
        autoPlay: false
      });
      tlLayer.addTo(map);
      tlControl.addTo(map);
      tlControl.addTimelines(tlLayer);
    }
    timeUI.playBtn.textContent = on ? "Playback: on" : "Playback: off";
    timeUI.playBtn.classList.toggle("active", on);
    applyTimeFilter();
  }

  const TimeFilterControl = L.Control.extend({
    options: { position: "topright" },
    onAdd() {
      const root = L.DomUtil.create("div", "time-card");
      root.style.display = "none";
      root.innerHTML =
        '<div class="time-head"><span>Time filter</span>' +
        '<button type="button" class="playback-toggle">Playback: off</button></div>' +
        '<div class="range-stack">' +
        '<div class="range-track"></div><div class="range-fill"></div>' +
        '<input type="range" min="0" max="1000" value="0" aria-label="Filter start time">' +
        '<input type="range" min="0" max="1000" value="1000" aria-label="Filter end time">' +
        "</div>" +
        '<div class="time-labels"><span class="lo-label"></span><span class="hi-label"></span></div>';
      timeUI.card = root;
      const inputs = root.querySelectorAll("input");
      timeUI.lo = inputs[0];
      timeUI.hi = inputs[1];
      timeUI.fill = root.querySelector(".range-fill");
      timeUI.loLabel = root.querySelector(".lo-label");
      timeUI.hiLabel = root.querySelector(".hi-label");
      timeUI.playBtn = root.querySelector(".playback-toggle");
      timeUI.lo.addEventListener("input", onRangeInput);
      timeUI.hi.addEventListener("input", onRangeInput);
      timeUI.playBtn.addEventListener("click", () => setPlayback(!playbackOn));
      L.DomEvent.disableClickPropagation(root);
      L.DomEvent.disableScrollPropagation(root);
      return root;
    }
  });
  map.addControl(new TimeFilterControl());

  // ---- Feature details card (click a feature to edit name / times) ----
  // A chrome-less popup anchored at the click point. Inputs apply live: each
  // keystroke mutates feature.properties and rides the same debounced
  // map -> text -> LocalStorage sync as a Geoman drag; a blank input removes
  // the property. While the GeoJSON text is dirty the card is display-only.
  const detailsCard = L.DomUtil.create("div", "details-card");
  detailsCard.innerHTML =
    '<div class="details-head"><span>Facts</span>' +
    '<button type="button" class="details-close" title="Close">&times;</button></div>' +
    '<label class="details-field"><span>Name</span>' +
    '<input data-prop="name" type="text" placeholder="label"></label>' +
    '<label class="details-field"><span>Datetime</span>' +
    '<input data-prop="datetime" type="text" placeholder="1920 or 2020-03~"></label>' +
    '<label class="details-field"><span>Start</span>' +
    '<input data-prop="start" type="text" placeholder="1900 or .."></label>' +
    '<label class="details-field"><span>End</span>' +
    '<input data-prop="end" type="text" placeholder="1950 or .."></label>' +
    '<div class="details-hint"></div>' +
    '<button type="button" class="details-text" title="Show / hide the text panel"></button>';
  const detailsInputs = Array.from(detailsCard.querySelectorAll("input"));
  const detailsHint = detailsCard.querySelector(".details-hint");
  let selectedLayer = null;

  const detailsPopup = L.popup({
    closeButton: false,
    closeOnClick: false, // closing is handled by the map click below
    className: "details-popup",
    minWidth: 240
  });
  detailsPopup.on("remove", () => { // fires on every close path (button, Esc, ...)
    if (selectedLayer) {
      if (selectedLayer.setStyle) {
        let color = "#0284c7";
        if (selectedLayer.__playback) {
          // restore the playback look: static violet, or the redshift hue a
          // range feature wears at the current playhead
          const f = selectedLayer.feature;
          color = f && f.__range && f.__interval && tlLayer
            ? redshiftColor(f.__interval.min, f.__interval.max, tlLayer.time)
            : "#7c3aed";
        }
        selectedLayer.setStyle({ color, weight: 2 });
      }
      selectedLayer = null;
    }
  });

  function closeDetails() {
    closeTextPanel(); // commits a pending text-panel edit before selection is dropped
    detailsPopup.remove();
  }

  // Enter while the card is open: flush the debounced map->text sync
  // immediately (the pending edit may not have serialized yet), then close.
  // Works from anywhere except the GeoJSON editor, where Enter keeps its
  // native meaning.
  function commitDetails() {
    if (mapSyncTimer) {
      clearTimeout(mapSyncTimer);
      syncNow();
    }
    closeDetails();
  }

  // Cancel any active Geoman mode (draw in progress, edit, drag, rotate,
  // cut, removal). Each call is a no-op when already inactive. Unlike
  // setGeomanEnabled this is mode cleanup only - it must not touch the
  // geojson-dirty state.
  function cancelActiveModes() {
    if (!map.pm) { return false; }
    const pm = map.pm;
    const active = pm.globalDrawModeEnabled() || pm.globalEditModeEnabled() ||
      pm.globalDragModeEnabled() || pm.globalRemovalModeEnabled() ||
      pm.globalRotateModeEnabled() || pm.globalCutModeEnabled();
    if (!active) { return false; }
    pm.Draw.disable();
    pm.disableGlobalEditMode();
    pm.disableGlobalDragMode();
    pm.disableGlobalRemovalMode();
    pm.disableGlobalRotateMode();
    pm.disableGlobalCutMode();
    return true;
  }

  // Digit keys toggle Geoman tools, in toolbar order (button titles show
  // the digit). Pressing a tool's digit again turns it back off - the
  // toolbar button itself is clicked so Geoman owns the toggle state.
  const TOOL_KEYS = {
    "1": "marker", "2": "polyline", "3": "polygon", "4": "rectangle",
    "5": "edit", "6": "drag", "7": "rotate", "8": "cut", "9": "delete"
  };
  // keys that mean something special to the element they're on
  const onFormControl = t => !!(t && t.closest &&
    t.closest("button, input, select, textarea, a, [contenteditable]"));

  document.addEventListener("keydown", e => {
    if (e.isComposing) { return; }
    const t = e.target;
    if (t && t.closest && t.closest(".CodeMirror, #geojson-input, #text-input")) { return; }
    if (e.key === "Enter") {
      if (e.defaultPrevented) { return; } // Geoman just committed an in-progress shape
      // Enter dismisses the current overlay: a still-active Geoman mode
      // (stop dropping more shapes) first, then the details card. With
      // nothing left to dismiss but an open panel, it jumps into the text.
      if (cancelActiveModes()) { e.preventDefault(); return; }
      if (selectedLayer) { e.preventDefault(); commitDetails(); return; }
      if (panel.classList.contains("open") && !onFormControl(t)) {
        e.preventDefault();
        (cm || textarea).focus();
      }
      return;
    }
    if (onFormControl(t)) { return; }
    // Space toggles the GeoJSON panel. It opens without stealing the
    // caret, so Space-Space closes again.
    if (e.key === " ") {
      e.preventDefault();
      if (panel.classList.contains("open")) { collapsePanel(); } else { openPanel(false); }
      return;
    }
    if (!e.ctrlKey && !e.metaKey && !e.altKey && TOOL_KEYS[e.key]) {
      const btn = document.querySelector(`.leaflet-pm-icon-${TOOL_KEYS[e.key]}`);
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });

  // The working (dataLayer) layer sharing a playback copy's feature object.
  function workingLayerFor(playbackLayer) {
    let found = null;
    dataLayer.getLayers().forEach(l => { if (l.feature === playbackLayer.feature) { found = l; } });
    return found;
  }

  function selectFeature(layer, latlng) {
    if (selectedLayer === layer) { return; } // keep card and input focus as-is
    closeDetails();
    selectedLayer = layer;
    // Geoman hands us raw layers until the next full render - attach a
    // minimal feature so properties can attach; toGeoJSON() keeps them
    // (Leaflet merges layer.feature.properties over fresh geometry).
    if (!layer.feature) {
      layer.feature = { type: "Feature", properties: {}, geometry: layer.toGeoJSON().geometry };
    }
    if (layer.setStyle) { layer.setStyle({ color: "#7c3aed", weight: 4 }); } // markers can't be restyled
    const props = layer.feature.properties || {};
    detailsInputs.forEach(input => {
      const v = props[input.dataset.prop];
      input.value = v == null ? "" : String(v);
      input.classList.remove("invalid");
    });
    detailsHint.textContent = "";
    refreshTextPreview();
    detailsPopup.setContent(detailsCard).setLatLng(latlng).openOn(map);
  }

  detailsCard.querySelector(".details-close").addEventListener("click", closeDetails);

  detailsInputs.forEach(input => {
    input.addEventListener("input", () => {
      if (!selectedLayer) { return; }
      const prop = input.dataset.prop;
      const props = selectedLayer.feature.properties || (selectedLayer.feature.properties = {});
      if (input.value) { props[prop] = input.value; } else { delete props[prop]; }
      if (prop === "name") {
        syncNameLabel(selectedLayer); // keep the on-shape label in step
        if (selectedLayer.__playback) {
          // mirror onto the working copy: the playback layer (and its label)
          // is discarded when playback ends, the working label persists
          const wl = workingLayerFor(selectedLayer);
          if (wl) { syncNameLabel(wl); }
        }
        refreshTextTitle(); // and the text panel header, if it is open
      }
      const invalid = prop !== "name" && input.value !== "" && !parseEdtf(input.value);
      input.classList.toggle("invalid", invalid); // warn only - the value is kept
      detailsHint.textContent = invalid ? "Not parseable as EDTF - stored as-is" : "";
      scheduleMapSync(); // debounced: map -> editor text -> LocalStorage
    });
  });

  // ---- Feature text panel (long free-form "text" property) ----
  // Opened from the preview line at the bottom of the details card; the map
  // shrinks from the right to reveal a full-height editor. Edits stay local
  // (dirty -> Update / Oops beside the title) and closing commits them, so
  // nothing typed is lost. Textareas normalize \r\n and \r to \n, so
  // dirtiness compares against the normalized stored value: merely opening
  // CRLF text never marks it dirty, and untouched bytes are never rewritten.
  const mapWrap = document.getElementById("map-wrap");
  const textPanel = document.getElementById("text-panel");
  const textInput = document.getElementById("text-input");
  const textUpdateBtn = document.getElementById("text-update-btn");
  const textOopsBtn = document.getElementById("text-oops-btn");
  const textBar = document.getElementById("text-bar");
  const textTitle = document.getElementById("text-title");
  const textPreview = detailsCard.querySelector(".details-text");
  const textMd = document.getElementById("text-md");
  const textTabEdit = document.getElementById("text-tab-edit");
  const textTabPreview = document.getElementById("text-tab-preview");

  const storedText = layer => {
    const t = layer && layer.feature && layer.feature.properties ?
      layer.feature.properties.text : null;
    return t == null ? "" : String(t);
  };
  const normalized = s => s.replace(/\r\n|\r/g, "\n");

  function refreshTextPreview() {
    const first = storedText(selectedLayer).split(/\r\n|\r|\n/, 1)[0];
    const shown = first.trim() ? first : "";
    textPreview.textContent = shown || "Text";
    textPreview.classList.toggle("placeholder", !shown);
  }

  function refreshTextButtons() {
    const dirty = Boolean(selectedLayer) &&
      textInput.value !== normalized(storedText(selectedLayer));
    textUpdateBtn.classList.toggle("show", dirty);
    textOopsBtn.classList.toggle("show", dirty);
  }

  // Writes the editor's value onto the selected feature (blank removes the
  // property) and rides the standard debounced map -> text sync.
  function commitText() {
    if (!selectedLayer) { return; }
    if (textInput.value !== normalized(storedText(selectedLayer))) {
      const props = selectedLayer.feature.properties || (selectedLayer.feature.properties = {});
      if (textInput.value) { props.text = textInput.value; } else { delete props.text; }
      refreshTextPreview();
      scheduleMapSync();
    }
    refreshTextButtons();
  }

  // Leaflet must track the CSS transition, not just its end state.
  function animateInvalidateSize() {
    const start = performance.now();
    const tick = () => {
      map.invalidateSize(); // keeps the center while the viewport resizes
      if (performance.now() - start < 350) { requestAnimationFrame(tick); }
    };
    requestAnimationFrame(tick);
  }

  // Panel header: the feature's name when one is set, else the generic
  // "Text". textContent, so no escaping is needed (unlike tooltip labels).
  function refreshTextTitle() {
    textTitle.textContent = selectedLayer && hasName(selectedLayer.feature)
      ? String(selectedLayer.feature.properties.name)
      : "Text";
  }

  function openTextPanel() {
    // the two side panels fight for the same map area; opening Text
    // collapses the GeoJSON panel (without touching its edit state)
    if (panel.classList.contains("open")) { collapsePanel(); }
    textInput.value = normalized(storedText(selectedLayer));
    refreshTextButtons();
    refreshTextTitle();
    setTextTab("edit"); // the panel opens on the editor, never auto-focused
    textPanel.classList.add("open");
    document.body.classList.add("text-open");
    animateInvalidateSize();
  }

  function closeTextPanel() {
    if (!textPanel.classList.contains("open")) { return; }
    commitText();
    textPanel.classList.remove("open");
    document.body.classList.remove("text-open");
    animateInvalidateSize();
  }

  textPreview.addEventListener("click", () => {
    if (!selectedLayer) { return; }
    if (textPanel.classList.contains("open")) { closeTextPanel(); } else { openTextPanel(); }
  });

  textInput.addEventListener("input", refreshTextButtons);
  // Clicking anywhere above the divider (title or empty bar space) closes the
  // panel; Update / Oops stop propagation, so they never trigger this.
  textBar.addEventListener("click", closeTextPanel);
  textUpdateBtn.addEventListener("click", e => { e.stopPropagation(); commitText(); });
  textOopsBtn.addEventListener("click", e => {
    e.stopPropagation();
    textInput.value = normalized(storedText(selectedLayer));
    refreshTextButtons();
    if (!textMd.hidden) { renderTextMarkdown(); } // Oops may run while previewing
  });

  // ---- bottom tabs: flip the panel between editor and Markdown preview ----
  // The preview always renders the textarea's current value, so unsaved edits
  // are visible without committing. marked passes raw HTML through by design,
  // so the output is sanitized with DOMPurify (marked's documented pairing).
  // If either CDN library failed to load, the tab degrades to escaped
  // plain-text preview instead of rendered (and unsanitized) HTML.
  const markdownReady = typeof marked !== "undefined" && typeof DOMPurify !== "undefined";

  function renderTextMarkdown() {
    if (markdownReady) {
      // single newlines become <br>: free-form notes read as typed
      textMd.innerHTML = DOMPurify.sanitize(marked.parse(textInput.value, { breaks: true }));
      // keep links from navigating the map app away
      textMd.querySelectorAll("a[href]").forEach(a => {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      });
    } else {
      textMd.textContent = textInput.value;
      textMd.title = "Markdown renderer unavailable - showing plain text";
    }
  }

  function setTextTab(mode, focus) {
    const preview = mode === "preview";
    textInput.hidden = preview;
    textMd.hidden = !preview;
    textTabEdit.setAttribute("aria-selected", String(!preview));
    textTabPreview.setAttribute("aria-selected", String(preview));
    if (preview) {
      renderTextMarkdown();
    } else if (focus) {
      textInput.focus();
    }
  }

  textTabEdit.addEventListener("click", () => setTextTab("edit", true));
  textTabPreview.addEventListener("click", () => setTextTab("preview", true));

  // Keep the map's right inset equal to the panel's actual rendered width
  // (the min(90vw, 150ch) formula resolves against the panel's own font, so
  // JS measures the element instead of duplicating the math).
  const syncTextPanelWidth = () => {
    mapWrap.style.setProperty("--text-panel-w", `${textPanel.offsetWidth}px`);
    if (textPanel.classList.contains("open")) { animateInvalidateSize(); }
  };
  syncTextPanelWidth();
  if (window.ResizeObserver) {
    new ResizeObserver(syncTextPanelWidth).observe(textPanel);
  } else {
    window.addEventListener("resize", syncTextPanelWidth);
  }

  map.on("click", e => {
    // Feature clicks also propagate to the map (bubblingMouseEvents), so a
    // plain map-click close would instantly undo the card selectFeature just
    // opened in the same event. Skip any click that landed on an interactive
    // layer; only genuinely empty map clicks deselect.
    const t = e.originalEvent.target;
    if (t && t.closest && t.closest(".leaflet-interactive")) { return; }
    closeDetails();
  });

  // Load persisted GeoJSON (or the empty collection) before CM takes over.
  const savedText = loadSavedText();
  textarea.value = savedText ? savedText : EMPTY_GEOJSON_TEXT;

  // CodeMirror, with a plain-textarea fallback if the CDN library fails to load.
  if (typeof CodeMirror !== "undefined") {
    cm = CodeMirror.fromTextArea(textarea, {
      mode: "application/json",
      lineNumbers: true,
      matchBrackets: true,
      autoCloseBrackets: true,
      lint: true,
      indentUnit: 2,
      tabSize: 2,
      gutters: ["CodeMirror-lint-markers", "CodeMirror-linenumbers"]
    });
  } else {
    setStatus("CodeMirror CDN failed to load - plain text mode", true);
  }

  const editorValue = () => (cm ? cm.getValue() : textarea.value);

  const parsed = parseEditor();
  lastRendered = parsed.text;
  if (parsed.ok) { renderData(parsed.data); }
  refreshStatus();

  if (cm) { cm.on("change", onEdit); }
  else { textarea.addEventListener("input", onEdit); }

  updateBtn.addEventListener("click", e => {
    e.stopPropagation(); // don't toggle the panel
    const r = parseEditor();
    if (!r.ok) {
      setStatus(`Invalid JSON: ${r.error}`, true);
      return;
    }
    renderData(r.data);
    lastRendered = r.text;
    saveNow();
    refreshStatus();
    (cm || textarea).focus();
  });

  neverMindBtn.addEventListener("click", e => {
    e.stopPropagation(); // don't toggle the panel
    const saved = loadSavedText();
    const text = saved ? saved : EMPTY_GEOJSON_TEXT;
    setEditorText(text);
    if (text !== lastRendered) {
      // storage and the editor disagree with what is drawn (e.g. right after
      // a Reset) - bring the map back in line with the restored text
      const r = parseEditor();
      if (r.ok) { renderData(r.data); }
    }
    lastRendered = text;
    refreshStatus();
    (cm || textarea).focus();
  });

  // The panel is anchored bottom-left: a small pill when collapsed, full
  // width when open. Collapsed size is fit-content, which CSS can't animate,
  // so expand/collapse pin an explicit start width, then release it to let
  // the transition run to the class-driven target.
  let widthAnimHandler = null;

  function stopWidthAnim() {
    if (widthAnimHandler) {
      panel.removeEventListener("transitionend", widthAnimHandler);
      widthAnimHandler = null;
    }
  }

  function expandPanel() {
    stopWidthAnim();
    const w0 = panel.offsetWidth;          // current pill (or mid-anim) width
    panel.classList.add("open");
    panel.style.height = "";               // release any pinned height
    panel.style.width = `${w0}px`;         // pin start width
    void panel.offsetWidth;                // commit the start state
    panel.style.width = "";                // release -> animates to full width
  }

  function collapsePanel() {
    stopWidthAnim();
    const w0 = panel.offsetWidth;          // current full width
    const h0 = panel.offsetHeight;
    panel.style.width = `${w0}px`;         // pin both at current size
    panel.style.height = `${h0}px`;
    panel.style.transition = "none";
    panel.classList.remove("open");
    panel.style.width = "auto";            // measure the collapsed pill size
    const w1 = panel.offsetWidth;
    panel.style.width = `${w0}px`;         // back to the pinned start state
    panel.style.height = `${h0}px`;
    void panel.offsetWidth;
    panel.style.transition = "";           // re-enable transitions
    panel.style.width = `${w1}px`;         // width: full -> pill
    panel.style.height = "";               // height: current -> 46px
    widthAnimHandler = e => {
      if (e.propertyName !== "width") { return; }
      panel.style.width = "";              // hand control back to CSS
      panel.removeEventListener("transitionend", widthAnimHandler);
      widthAnimHandler = null;
    };
    panel.addEventListener("transitionend", widthAnimHandler);
  }

  function openPanel(focus = true) {
    if (!panel.classList.contains("open")) { expandPanel(); }
    setTimeout(() => { if (cm) { cm.refresh(); } }, 320); // after transition
    if (focus) { (cm || textarea).focus(); }
  }

  panelBar.addEventListener("click", () => {
    // opens without grabbing the caret (same as the Space shortcut); Enter
    // is the way to jump into the text once the panel is open
    if (panel.classList.contains("open")) { collapsePanel(); } else { openPanel(false); }
  });

  // ---- Header menu: brand click slides the whole strip right, trading the
  // Layers dropdown (out over the right edge) for the Reset button (in at
  // the left margin). Shift = one side margin (16) + the button width, so
  // the closed state parks the button exactly offscreen. ----
  document.documentElement.style.setProperty(
    "--header-shift", `${resetBtn.offsetWidth + 16}px`
  );

  brand.addEventListener("click", () => header.classList.toggle("menu-open"));

  function resetAll() {
    try { localStorage.clear(); } catch { /* ignore */ }
    clearTimeout(mapSyncTimer);  // don't resurrect wiped data via a pending map sync
    overlaySelect.value = "";
    setOverlay("");              // overlay state lived in storage
    // Wipe the text but leave lastRendered untouched: the map (and storage)
    // keep the old features until the user confirms with "Update".
    setEditorText(EMPTY_GEOJSON_TEXT);
    refreshStatus();
    openPanel();
  }

  resetBtn.addEventListener("click", e => {
    e.stopPropagation();
    resetAll();
    header.classList.remove("menu-open");
  });

  if (cm) {
    // Keep Leaflet keyboard shortcuts from firing while typing in the editor,
    // and let Escape drop the caret back out (global shortcuts resume after).
    ["keydown", "keyup", "keypress"].forEach(type => {
      cm.getWrapperElement().addEventListener(type, e => {
        if (type === "keydown" && e.key === "Escape" && !e.isComposing) {
          e.preventDefault();
          cm.getInputField().blur(); // focus lives on CM's hidden input
        }
        e.stopPropagation();
      });
    });
  } else {
    setStatus("CodeMirror CDN failed to load - plain text mode", true);
    textarea.addEventListener("keydown", e => { // plain fallback: same Escape blur
      if (e.key === "Escape" && !e.isComposing) {
        e.preventDefault();
        textarea.blur();
      }
    });
  }

  // ---- Graphical drawing/editing (Leaflet-Geoman) ----
  // Whenever the text is clean, map changes sync straight back into the editor
  // and LocalStorage without needing the Update button. While the text is
  // dirty (unsaved edits), the toolbar is hidden and active modes are
  // cancelled, so the text - not the map - owns the data until it is resolved
  // via Update / Never mind. Panning and zooming are unaffected.

  function setEditorText(text) {
    syncingFromMap = true;
    if (cm) { cm.setValue(text); } else { textarea.value = text; }
    syncingFromMap = false;
  }

  function setGeomanEnabled(enabled) {
    if (!map.pm) { return; }
    document.body.classList.toggle("geojson-dirty", !enabled);
    if (!enabled) {
      // cancel any active mode; each call is a no-op when already inactive
      map.pm.Draw.disable();
      map.pm.disableGlobalEditMode();
      map.pm.disableGlobalDragMode();
      map.pm.disableGlobalRemovalMode();
      map.pm.disableGlobalRotateMode();
      map.pm.disableGlobalCutMode();
    }
  }

  function addSerialized(layer) {
    // a cut can produce a LayerGroup of several pieces - flatten it
    if (layer instanceof L.LayerGroup) {
      layer.getLayers().forEach(l => dataLayer.addLayer(l));
    } else {
      dataLayer.addLayer(layer);
    }
  }

  function wireGeomanSync(layer) {
    if (layer.getLayers) {
      layer.getLayers().forEach(l => wireGeomanSync(l));
      return;
    }
    // pm:edit / pm:dragend / pm:rotateend are LAYER events in Geoman (only
    // create/cut/remove fire on the map), so every feature gets its own listeners.
    layer.on("pm:edit pm:dragend pm:rotateend", () => {
      const tt = layer.getTooltip();
      if (tt && map.hasLayer(tt)) { layer.openTooltip(); } // re-anchor the label after the shape moved
      scheduleMapSync();
    });
    layer.on("click", e => selectFeature(layer, e.latlng)); // opens the details card
  }

  function syncNow() {
    if (!dataLayer) { return; }
    if (editorValue() !== lastRendered) {
      // the text is dirty - it owns the data; retry once it is resolved
      mapSyncTimer = setTimeout(syncNow, 1000);
      return;
    }
    dataLayer.getLayers().slice().forEach(l => {
      if (!map.hasLayer(l)) { dataLayer.removeLayer(l); }
    });
    const text = JSON.stringify(dataLayer.toGeoJSON(), null, 2);
    setEditorText(text);
    lastRendered = text;
    saveNow();
    refreshStatus();
    rebuildTimeIndex(); // cuts/removals change the layer set behind the map's back
  }

  function scheduleMapSync() {
    clearTimeout(mapSyncTimer);
    mapSyncTimer = setTimeout(syncNow, 400);
  }

  if (map.pm) {
    map.pm.addControls({
      position: "topleft",
      drawMarker: true,
      drawPolyline: true,
      drawPolygon: true,
      drawRectangle: true,
      drawCircle: false,  // circles don't round-trip to valid GeoJSON
      drawText: false,
      editMode: true,
      dragMode: true,
      rotateMode: true,
      cutPolygon: true,
      removalMode: true
    });
    // Geoman's native key exits are off by default: Escape cancels whatever
    // mode is active; Enter commits a multi-point shape in progress (line,
    // polygon, started rectangle) and keeps the mode running for the next
    // one. Point-and-click tools (marker, ...) never commit on Enter.
    map.pm.setGlobalOptions({ exitModeOnEscape: true, finishOnEnter: true });
    // advertise the digit shortcuts (TOOL_KEYS) on the toolbar tooltips
    Object.values(TOOL_KEYS).forEach((name, i) => {
      const btn = document.querySelector(`.leaflet-pm-icon-${name}`);
      if (btn) { btn.title = `${btn.title || name} (${i + 1})`; }
    });

    map.on("pm:create pm:cut", e => {
      if (!dataLayer) { renderData({ type: "FeatureCollection", features: [] }); }
      addSerialized(e.layer);
      wireGeomanSync(e.layer);
      // cut pieces can inherit the original's properties - label them too
      const pieces = e.layer instanceof L.LayerGroup ? e.layer.getLayers() : [e.layer];
      pieces.forEach(l => bindNameLabel(l.feature, l));
      scheduleMapSync();
    });
    map.on("pm:remove", e => {
      if (e.layer === selectedLayer) { closeDetails(); }
      scheduleMapSync();
    });
  } else {
    setStatus("Geoman CDN failed to load - drawing disabled", true);
  }

  window.addEventListener("pagehide", () => {
    clearTimeout(statusTimer);
    clearTimeout(viewSaveTimer);
    clearTimeout(mapSyncTimer);
    commitText(); // flush a pending text-panel edit (self-skips with nothing selected/dirty)
    syncNow();  // flush a pending map edit (self-skips while the text is dirty)
    saveView(); // unsaved text edits are intentionally discarded
  });
})();
</script>
</body>
</html>
