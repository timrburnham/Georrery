<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Georrery</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.css"
      integrity="sha512-eqIZI0sGJKWMxBLGcHYg7Tus8jzMu78XcJAPXIlF8P2JP1dFKw5fi7vmOZ3bW8Pk6ae/C4nCxiVF1noCBmOjQQ=="
      crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css"
      integrity="sha512-yAvYFCgl0jKssk1XXo079Ec7sVXfN3OIotWiUP7zTrHhcRxMgRnEFjYhesnBZSfYPkd3sX7BmVTaWQLXvITMnQ=="
      crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/lint.min.css"
      integrity="sha512-bfa1NKQKC/ytQSvZAqmdhn61tSpSyVQ1nkp41fkhDsPeG3jTvd36smZdLYv4Zs7gXHjNwTk0yDvS1nMfVzwwlw=="
      crossorigin="anonymous">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #0f172a;
  }

  header {
    flex: 0 0 auto;
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    background: #1e293b;
    color: #f1f5f9;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    z-index: 1000;
  }

  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .04em;
  }

  header h1 span { color: #38bdf8; }

  #overlay-select-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #overlay-select-wrap label {
    font-size: .8rem;
    color: #94a3b8;
  }

  #overlay-select {
    background: #0f172a;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: .85rem;
    outline: none;
    cursor: pointer;
    max-width: 190px;
  }

  #overlay-select:hover, #overlay-select:focus { border-color: #38bdf8; }

  #overlay-select option, #overlay-select optgroup {
    background: #1e293b;
    color: #f1f5f9;
  }

  #map-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }

  #map {
    position: absolute;
    inset: 0;
    background: #a8c8e0;
  }

  /* ---- GeoJSON panel ---- */
  #panel {
    position: absolute;
    left: 12px;
    right: 12px;
    /* sits above the Leaflet attribution bar, which is measured live
       (--attribution-h set by JS) since its text can wrap */
    bottom: calc(var(--attribution-h, 16px) + 12px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    height: 46px;
    max-height: calc(100% - var(--attribution-h, 16px) - 36px);
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(6px);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    overflow: hidden;
    transition: height .3s ease;
  }

  #panel.open { height: 50%; }

  #panel-bar {
    flex: 0 0 auto;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    cursor: pointer;
    user-select: none;
  }

  #panel-bar h2 {
    font-size: 1rem;
    font-weight: 600;
    color: #1e293b;
  }

  #update-btn {
    flex: 0 0 auto;
    border: none;
    border-radius: 999px;
    padding: 5px 14px;
    font: 600 .78rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .02em;
    color: #fff;
    background: #0284c7;
    cursor: pointer;
    opacity: 0;
    transform: translateX(8px);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease, background-color .15s ease;
  }

  #update-btn.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  #update-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }

  #update-btn:not(:disabled):hover { background: #0369a1; }

  #panel-status {
    flex: 1 1 auto;
    font-size: .8rem;
    color: #64748b;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #panel-status.error { color: #dc2626; font-weight: 600; }

  #chevron {
    flex: 0 0 auto;
    color: #64748b;
    transition: transform .3s ease;
  }

  #panel.open #chevron { transform: rotate(180deg); }

  #panel-body {
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 12px 12px;
  }

  /* ---- CodeMirror ---- */
  .CodeMirror {
    height: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #f8fafc;
    color: #0f172a;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .CodeMirror-focused { border-color: #38bdf8; }

  .CodeMirror-gutters {
    background: #eef2f7;
    border-right: 1px solid #dbe3ec;
  }

  .CodeMirror-linenumber { color: #94a3b8; }

  /* fallback when CodeMirror fails to load */
  #geojson-input {
    width: 100%;
    height: 100%;
    resize: none;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #0f172a;
    background: #f8fafc;
    outline: none;
  }
</style>
</head>
<body>

<header>
  <h1>Geo<span>rrery</span></h1>
  <div id="overlay-select-wrap">
    <label for="overlay-select">Overlay</label>
    <select id="overlay-select">
      <option value="">None</option>
      <optgroup label="Waymarked Trails">
        <option value="wmt-hiking">Hiking routes</option>
        <option value="wmt-cycling">Cycling routes</option>
        <option value="wmt-mtb">MTB routes</option>
        <option value="wmt-skating">Skating routes</option>
        <option value="wmt-riding">Riding routes</option>
        <option value="wmt-winter">Winter routes</option>
      </optgroup>
      <optgroup label="OpenSeaMap">
        <option value="oseam-seamark">Sea marks</option>
      </optgroup>
    </select>
  </div>
</header>

<div id="map-wrap">
  <div id="map"></div>

  <div id="panel">
    <div id="panel-bar" title="Toggle GeoJSON panel">
      <h2>GeoJSON</h2>
      <button id="update-btn" type="button" title="Render edited GeoJSON onto the map">Update</button>
      <div id="panel-status"></div>
      <span id="chevron">&#9650;</span>
    </div>
    <div id="panel-body">
      <textarea id="geojson-input" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.js"
        integrity="sha512-BiIrkmwG5bdOa1AWTMFAI9I5ab/qQd6tdhQLEmawFYfT0YlR77V/l2Jvel3k8hA45PwV9V4JcXC6TjDFkSV1XA=="
        crossorigin="anonymous"></script>
<!-- cdnjs's precompressed brotli copy of codemirror.min.js 5.65.21 is out of sync
     (different bytes than the plain file), which breaks SRI in browsers that
     negotiate brotli - this file is served from jsDelivr instead. -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.min.js"
        integrity="sha512-XF1G4hLzXBiQrxOjvhSYHCNoeDIXsDOJtqZMOptZwQtL84qN4iswdD7OJ42iCoxVLppfokVmPl/9UZKWQcFh/w=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/javascript/javascript.min.js"
        integrity="sha512-k1xN8Ok3EjJVqkyue+rrYB9WJi34a101SAdtjJGS4sM0ZSFTb7IBseqeCL4OcKzmQRmtrKIYqVROZYIpHXc3Mg=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsonlint/1.6.0/jsonlint.min.js"
        integrity="sha512-6qbnCNQe7wVcBDvhNJT6lZsbDKHCQQBk7yOBQg4s/9GG812CknK0EEIqG2IS10XuNxIQNWjMJd6VLwwezICz6w=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/lint.min.js"
        integrity="sha512-lXcl97MDW/i/BsKkQ6J4M3iSNyIpGyEdbIZTMM77cwtxoDZDABxH/7n3G3Sidx/Bjrpa1KrX8dfNPnAqafQjmw=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/json-lint.min.js"
        integrity="sha512-r8rxpmeeEUAdIovyAOYwk1/kb4vK4wGk5aAj+30blS6DoLJyNKrukS483cLXgFoTV3JGpkFH6r0kKZWiRiut/A=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/closebrackets.min.js"
        integrity="sha512-rijIQfP2KYlfTjFMjJg33a5fVUsZbLsy6fLSCZsM1jNI35n4xl1cBiIjxK5tANQYPWqa1niMYK5lWn2CTSUPKw=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/matchbrackets.min.js"
        integrity="sha512-ynfHqOx3h/V0CDEdHKHdS4C0Kp5tcpILVbUOqNczDbRDiKqrMx3mONwyFHcMmOs43MMiGfD9gDjbvnQ5fOZxvw=="
        crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";

  var SAMPLE_GEOJSON = {
    "type": "FeatureCollection",
    "features": [
      {
        "type": "Feature",
        "properties": { "name": "Null Island" },
        "geometry": { "type": "Point", "coordinates": [0, 0] }
      },
      {
        "type": "Feature",
        "properties": { "name": "Sample Area" },
        "geometry": {
          "type": "Polygon",
          "coordinates": [[[-10, 35], [10, 35], [10, 50], [-10, 50], [-10, 35]]]
        }
      }
    ]
  };

  var map = L.map("map", {
    worldCopyJump: true,
    attributionControl: true
  }).setView([20, 0], 2);

  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    maxZoom: 17,
    attribution:
      'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
      '<a href="http://viewfinderpanoramas.org">SRTM</a> | ' +
      'Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> ' +
      '(<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
  }).addTo(map);

  var panel     = document.getElementById("panel");
  var panelBar  = document.getElementById("panel-bar");
  var statusEl  = document.getElementById("panel-status");
  var updateBtn = document.getElementById("update-btn");
  var textarea  = document.getElementById("geojson-input");
  var dataLayer = null;
  var lastRendered = null;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle("error", !!isError);
  }

  function countFeatures(data) {
    if (data && data.type === "FeatureCollection" && Array.isArray(data.features)) {
      return data.features.length;
    }
    return 1;
  }

  function renderData(data) {
    if (dataLayer) {
      map.removeLayer(dataLayer);
      dataLayer = null;
    }
    dataLayer = L.geoJSON(data, {
      style: function () {
        return { color: "#0284c7", weight: 2, fillOpacity: 0.25 };
      },
      pointToLayer: function (_feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 6, color: "#0284c7", weight: 2, fillOpacity: 0.5
        });
      },
      onEachFeature: function (feature, layer) {
        if (feature.properties && feature.properties.name) {
          layer.bindPopup(feature.properties.name);
        }
      }
  }).addTo(map);

  // ---- Keep the GeoJSON panel clear of the attribution bar ----
  // The attribution bar (bottom-right of the map) can wrap to several lines
  // on narrow screens or when overlay attributions are active, so measure it.
  (function watchAttribution() {
    var el = map.attributionControl.getContainer();
    var apply = function () {
      document.documentElement.style.setProperty(
        "--attribution-h", el.offsetHeight + "px");
    };
    apply();
    if (window.ResizeObserver) {
      new ResizeObserver(apply).observe(el);
    } else {
      window.addEventListener("resize", apply);
    }
  })();

  // ---- Remembered map view ----
  // Saved a few seconds after you stop moving - never live per-frame/pan-step.
  function saveView() {
    try {
      var c = map.getCenter();
      localStorage.setItem("georrery.view", JSON.stringify({
        lat: Math.round(c.lat * 1e5) / 1e5,
        lng: Math.round(c.lng * 1e5) / 1e5,
        zoom: map.getZoom()
      }));
    } catch (e) { /* ignore */ }
  }

  function restoreView() {
    try {
      var v = JSON.parse(localStorage.getItem("georrery.view"));
      if (v && isFinite(v.lat) && isFinite(v.lng) && isFinite(v.zoom)) {
        map.setView([v.lat, v.lng], Math.max(0, Math.min(17, Math.round(v.zoom))), { animate: false });
        return true;
      }
    } catch (e) { /* ignore */ }
    return false;
  }

  restoreView(); // no saved view yet? the constructor's world view stands

  var viewSaveTimer = null;
  map.on("moveend zoomend", function () {
    clearTimeout(viewSaveTimer);
    viewSaveTimer = setTimeout(saveView, 3000); // one write per settled view
  });

  // ---- Overlay selection (header drop-down, single choice) ----
  var OVERLAYS = {
    "wmt-hiking": {
      url: "https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-cycling": {
      url: "https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-mtb": {
      url: "https://tile.waymarkedtrails.org/mtb/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-skating": {
      url: "https://tile.waymarkedtrails.org/skating/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-riding": {
      url: "https://tile.waymarkedtrails.org/riding/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-winter": {
      url: "https://tile.waymarkedtrails.org/winter/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "oseam-seamark": {
      url: "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Sea marks: &copy; <a href='https://openseamap.org'>OpenSeaMap</a> contributors (CC-BY-SA)"
    }
  };
  var overlaySelect = document.getElementById("overlay-select");
  var activeOverlay = null;

  function setOverlay(id) {
    if (activeOverlay) {
      map.removeLayer(activeOverlay);
      activeOverlay = null;
    }
    var def = OVERLAYS[id];
    if (def) {
      activeOverlay = L.tileLayer(def.url, {
        maxZoom: def.maxZoom,
        opacity: 0.9,
        attribution: def.attribution
      }).addTo(map);
    }
    try { localStorage.setItem("georrery.overlay", id || ""); } catch (e) { /* ignore */ }
  }

  overlaySelect.addEventListener("change", function () {
    setOverlay(overlaySelect.value);
  });

  (function restoreOverlay() {
    var saved = "";
    try { saved = localStorage.getItem("georrery.overlay") || ""; } catch (e) { /* ignore */ }
    if (!OVERLAYS[saved]) { saved = ""; }
    overlaySelect.value = saved;
    if (saved) { setOverlay(saved); }
  })();
  }

  function parseEditor() {
    var text = editorValue();
    try {
      return { ok: true, data: JSON.parse(text), text: text };
    } catch (e) {
      return { ok: false, error: e.message, text: text };
    }
  }

  function refreshStatus() {
    var r = parseEditor();
    var dirty = r.text !== lastRendered;
    updateBtn.classList.toggle("show", dirty);
    updateBtn.disabled = !r.ok;
    if (!r.ok) {
      setStatus("Invalid JSON: " + r.error, true);
      return;
    }
    var n = countFeatures(r.data);
    setStatus(n + " feature" + (n === 1 ? "" : "s") + (dirty ? " \u00b7 unsaved" : " rendered"), false);
  }

  function saveNow() {
    try { localStorage.setItem("georrery.geojson", editorValue()); } catch (e) { /* storage full/unavailable */ }
  }

  var syncTimer = null;
  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      saveNow();
      refreshStatus();
    }, 300);
  }

  // Load persisted GeoJSON (or a sample) into the textarea before CM takes over.
  var saved = null;
  try { saved = localStorage.getItem("georrery.geojson"); } catch (e) { /* ignore */ }
  textarea.value = (saved !== null && saved !== "")
    ? saved
    : JSON.stringify(SAMPLE_GEOJSON, null, 2);

  // CodeMirror, with a plain-textarea fallback if the CDN library fails to load.
  var cm = null;
  var editorValue;

  if (typeof CodeMirror !== "undefined") {
    cm = CodeMirror.fromTextArea(textarea, {
      mode: "application/json",
      lineNumbers: true,
      matchBrackets: true,
      autoCloseBrackets: true,
      lint: true,
      indentUnit: 2,
      tabSize: 2,
      gutters: ["CodeMirror-lint-markers", "CodeMirror-linenumbers"]
    });
    editorValue = function () { return cm.getValue(); };
  } else {
    editorValue = function () { return textarea.value; };
    setStatus("CodeMirror CDN failed to load - plain text mode", true);
  }

  lastRendered = editorValue();

  var r = parseEditor();
  if (r.ok) { renderData(r.data); }
  refreshStatus();

  function onEdit() {
    if (syncingFromMap) { return; } // map-originated; syncMapToText owns the state
    updateBtn.classList.toggle("show", editorValue() !== lastRendered);
    scheduleSync(); // persist + validate per keypress (debounced)
  }

  if (cm) { cm.on("change", onEdit); }
  else { textarea.addEventListener("input", onEdit); }

  updateBtn.addEventListener("click", function (e) {
    e.stopPropagation(); // don't toggle the panel
    var res = parseEditor();
    if (!res.ok) {
      setStatus("Invalid JSON: " + res.error, true);
      return;
    }
    renderData(res.data);
    lastRendered = res.text;
    clearTimeout(syncTimer);
    saveNow();
    refreshStatus();
    if (cm) { cm.focus(); } else { textarea.focus(); }
  });

  panelBar.addEventListener("click", function () {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) {
      setTimeout(function () { if (cm) { cm.refresh(); } }, 320); // after height transition
      if (cm) { cm.focus(); } else { textarea.focus(); }
    }
  });

  if (cm) {
    // Keep Leaflet keyboard shortcuts from firing while typing in the editor.
    ["keydown", "keyup", "keypress"].forEach(function (type) {
      cm.getWrapperElement().addEventListener(type, function (e) {
        e.stopPropagation();
      });
    });
  }

  // ---- Graphical drawing/editing (Leaflet-Geoman) ----
  // Map changes are the same data as the text, so they sync straight back into
  // the editor + LocalStorage without needing the Update button.
  var mapSyncTimer = null;
  var syncingFromMap = false;

  function addSerialized(layer) {
    // a cut can produce a LayerGroup of several pieces - flatten it
    if (layer instanceof L.LayerGroup) {
      layer.getLayers().forEach(function (l) { dataLayer.addLayer(l); });
    } else {
      dataLayer.addLayer(layer);
    }
  }

  function pruneRemoved() {
    dataLayer.getLayers().slice().forEach(function (layer) {
      if (!map.hasLayer(layer)) { dataLayer.removeLayer(layer); }
    });
  }

  function syncMapToText() {
    if (!dataLayer) { return; }
    pruneRemoved();
    var text = JSON.stringify(dataLayer.toGeoJSON(), null, 2);
    syncingFromMap = true;
    if (cm) { cm.setValue(text); } else { textarea.value = text; }
    syncingFromMap = false;
    lastRendered = text;
    saveNow();
    refreshStatus();
  }

  function scheduleMapSync() {
    clearTimeout(mapSyncTimer);
    mapSyncTimer = setTimeout(syncMapToText, 400);
  }

  if (map.pm) {
    map.pm.addControls({
      position: "topleft",
      drawMarker: true,
      drawPolyline: true,
      drawPolygon: true,
      drawRectangle: true,
      drawCircle: false,  // circles don't round-trip to valid GeoJSON
      drawText: false,
      editMode: true,
      dragMode: true,
      rotateMode: true,
      cutPolygon: true,
      removalMode: true
    });

    map.on("pm:create", function (e) { addSerialized(e.layer); scheduleMapSync(); });
    map.on("pm:cut", function (e) { addSerialized(e.layer); scheduleMapSync(); });
    map.on("pm:remove", scheduleMapSync);
    map.on("pm:edit pm:dragend pm:rotateend", scheduleMapSync);
  } else {
    setStatus("Geoman CDN failed to load - drawing disabled", true);
  }

  window.addEventListener("pagehide", function () {
    clearTimeout(syncTimer);
    clearTimeout(viewSaveTimer);
    saveNow();
    saveView();
  });
})();
</script>
</body>
</html>
