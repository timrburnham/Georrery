<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Georrery</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.css"
      integrity="sha512-eqIZI0sGJKWMxBLGcHYg7Tus8jzMu78XcJAPXIlF8P2JP1dFKw5fi7vmOZ3bW8Pk6ae/C4nCxiVF1noCBmOjQQ=="
      crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css"
      integrity="sha512-yAvYFCgl0jKssk1XXo079Ec7sVXfN3OIotWiUP7zTrHhcRxMgRnEFjYhesnBZSfYPkd3sX7BmVTaWQLXvITMnQ=="
      crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/lint.min.css"
      integrity="sha512-bfa1NKQKC/ytQSvZAqmdhn61tSpSyVQ1nkp41fkhDsPeG3jTvd36smZdLYv4Zs7gXHjNwTk0yDvS1nMfVzwwlw=="
      crossorigin="anonymous">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #0f172a;
  }

  header {
    flex: 0 0 auto;
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    background: #1e293b;
    color: #f1f5f9;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    z-index: 1000;
  }

  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .04em;
    cursor: pointer;
    user-select: none;
  }

  header h1:hover span { color: #7dd3fc; }

  /* slides open to the left of the brand name */
  #menu-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: max-width .3s ease, opacity .25s ease;
  }

  header.menu-open #menu-buttons { max-width: 170px; opacity: 1; }

  #menu-buttons button {
    border: 1px solid #475569;
    background: #334155;
    color: #f1f5f9;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: .8rem;
    cursor: pointer;
  }

  #menu-buttons button:hover {
    background: #dc2626;
    border-color: #dc2626;
  }

  header h1 span { color: #38bdf8; }

  #overlay-select-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  #overlay-select {
    background: #0f172a;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: .85rem;
    outline: none;
    cursor: pointer;
    max-width: 190px;
  }

  #overlay-select:hover, #overlay-select:focus { border-color: #38bdf8; }

  #overlay-select option, #overlay-select optgroup {
    background: #1e293b;
    color: #f1f5f9;
  }

  #map-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }

  #map {
    position: absolute;
    inset: 0;
    background: #a8c8e0;
  }

  /* ---- GeoJSON panel ---- */
  #panel {
    position: absolute;
    left: 12px;
    /* sits above the Leaflet attribution bar, which is measured live
       (--attribution-h set by JS) since its text can wrap */
    bottom: calc(var(--attribution-h, 16px) + 4px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    height: 46px;
    width: fit-content;
    max-height: calc(100% - var(--attribution-h, 16px) - 36px);
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(6px);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    overflow: hidden;
    transition: width .3s ease, height .3s ease;
  }

  #panel.open {
    height: 50%;
    width: calc(100% - 24px);
  }

  #panel-bar {
    flex: 0 0 auto;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    cursor: pointer;
    user-select: none;
  }

  #panel-bar h2 {
    font-size: 1rem;
    font-weight: 600;
    color: #1e293b;
  }

  #update-btn,
  #nevermind-btn {
    flex: 0 0 auto;
    border: none;
    border-radius: 999px;
    padding: 5px 14px;
    font: 600 .78rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .02em;
    color: #fff;
    background: #0284c7;
    cursor: pointer;
    opacity: 0;
    transform: translateX(8px);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease, background-color .15s ease;
  }

  #nevermind-btn { background: #64748b; }

  #update-btn.show,
  #nevermind-btn.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  #update-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }

  #update-btn:not(:disabled):hover { background: #0369a1; }
  #nevermind-btn:not(:disabled):hover { background: #475569; }

  #panel-status {
    flex: 1 1 auto;
    font-size: .8rem;
    color: #64748b;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* collapsed = compact pill: only the bar, no editor/status internals;
     the Update button keeps its slot while dirty so it stays clickable,
     otherwise it is removed from layout entirely */
  #panel:not(.open) #panel-status { display: none; }
  #panel:not(.open) #panel-body { display: none; }
  #panel:not(.open) #update-btn:not(.show),
  #panel:not(.open) #nevermind-btn:not(.show) { display: none; }

  #panel-status.error { color: #dc2626; font-weight: 600; }

  #chevron {
    flex: 0 0 auto;
    color: #64748b;
    transition: transform .3s ease;
  }

  #panel.open #chevron { transform: rotate(180deg); }

  #panel-body {
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 12px 12px;
  }

  /* ---- CodeMirror ---- */
  .CodeMirror {
    height: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #f8fafc;
    color: #0f172a;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .CodeMirror-focused { border-color: #38bdf8; }

  .CodeMirror-gutters {
    background: #eef2f7;
    border-right: 1px solid #dbe3ec;
  }

  .CodeMirror-linenumber { color: #94a3b8; }

  .range-stack input[type="range"]::-moz-range-track { background: transparent; }

  .time-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 2px;
    color: #64748b;
  }

  .feat-popup .popup-time {
    display: block;
    margin-top: 2px;
    color: #64748b;
    font-size: .85em;
  }

  /* ---- time filter card ---- */
  .time-card {
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(6px);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    padding: 8px 10px;
    font-size: .75rem;
    color: #1e293b;
    width: 230px;
  }

  .time-card .time-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .time-card button {
    font-size: .7rem;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
    color: #1e293b;
  }

  .time-card button.active {
    background: #7c3aed;
    border-color: #7c3aed;
    color: #fff;
  }

  .range-stack { position: relative; height: 20px; }

  .range-stack .range-track,
  .range-stack .range-fill {
    position: absolute;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    border-radius: 2px;
    pointer-events: none;
  }

  .range-stack .range-track { left: 0; right: 0; background: #cbd5e1; }
  .range-stack .range-fill { background: #7c3aed; }

  .range-stack input[type="range"] {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 20px;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    pointer-events: none;   /* only the thumbs catch the pointer */
  }

  .range-stack input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    pointer-events: auto;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7c3aed;
    border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    cursor: pointer;
  }

  .range-stack input[type="range"]::-moz-range-thumb {
    pointer-events: auto;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #7c3aed;
    border: 2px solid #fff;
    cursor: pointer;
  }

  /* fallback when CodeMirror fails to load */
  #geojson-input {
    width: 100%;
    height: 100%;
    resize: none;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #0f172a;
    background: #f8fafc;
    outline: none;
  }
</style>
</head>
<body>

<header>
  <div id="menu-buttons">
    <button type="button" id="reset-btn" title="Clear all locally stored data and the GeoJSON text">Reset</button>
  </div>
  <h1 id="brand" title="Show menu">Geo<span>rrery</span></h1>
  <div id="overlay-select-wrap">
    <select id="overlay-select" aria-label="Map overlay">
      <option value="">No Overlay</option>
      <optgroup label="Waymarked Trails">
        <option value="wmt-hiking">Hiking routes</option>
        <option value="wmt-cycling">Cycling routes</option>
        <option value="wmt-mtb">MTB routes</option>
        <option value="wmt-skating">Skating routes</option>
        <option value="wmt-riding">Riding routes</option>
        <option value="wmt-winter">Winter routes</option>
      </optgroup>
      <optgroup label="OpenSeaMap">
        <option value="oseam-seamark">Sea marks</option>
      </optgroup>
    </select>
  </div>
</header>

<div id="map-wrap">
  <div id="map"></div>

  <div id="panel">
    <div id="panel-bar" title="Toggle GeoJSON panel">
      <h2>GeoJSON</h2>
      <button id="update-btn" type="button" title="Render edited GeoJSON onto the map">Update</button>
      <button id="nevermind-btn" type="button" title="Discard edits and restore the saved GeoJSON">Never mind</button>
      <div id="panel-status"></div>
      <span id="chevron">&#9650;</span>
    </div>
    <div id="panel-body">
      <textarea id="geojson-input" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.js"
        integrity="sha512-BiIrkmwG5bdOa1AWTMFAI9I5ab/qQd6tdhQLEmawFYfT0YlR77V/l2Jvel3k8hA45PwV9V4JcXC6TjDFkSV1XA=="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.timeline@1.6.0/dist/leaflet.timeline.js"
        integrity="sha512-jGt9VJboJ1EExMlEDjqoZRZ2Te57YYG6iFs4grBsSzbV5bytERwY+Hh6fff4k/xZmTgPbk+xZfmMyYH6mg47Dw=="
        crossorigin="anonymous"></script>
<!-- cdnjs's precompressed brotli copy of codemirror.min.js 5.65.21 is out of sync
     (different bytes than the plain file), which breaks SRI in browsers that
     negotiate brotli - this file is served from jsDelivr instead. -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.min.js"
        integrity="sha512-XF1G4hLzXBiQrxOjvhSYHCNoeDIXsDOJtqZMOptZwQtL84qN4iswdD7OJ42iCoxVLppfokVmPl/9UZKWQcFh/w=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/javascript/javascript.min.js"
        integrity="sha512-k1xN8Ok3EjJVqkyue+rrYB9WJi34a101SAdtjJGS4sM0ZSFTb7IBseqeCL4OcKzmQRmtrKIYqVROZYIpHXc3Mg=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsonlint/1.6.0/jsonlint.min.js"
        integrity="sha512-6qbnCNQe7wVcBDvhNJT6lZsbDKHCQQBk7yOBQg4s/9GG812CknK0EEIqG2IS10XuNxIQNWjMJd6VLwwezICz6w=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/lint.min.js"
        integrity="sha512-lXcl97MDW/i/BsKkQ6J4M3iSNyIpGyEdbIZTMM77cwtxoDZDABxH/7n3G3Sidx/Bjrpa1KrX8dfNPnAqafQjmw=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/lint/json-lint.min.js"
        integrity="sha512-r8rxpmeeEUAdIovyAOYwk1/kb4vK4wGk5aAj+30blS6DoLJyNKrukS483cLXgFoTV3JGpkFH6r0kKZWiRiut/A=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/closebrackets.min.js"
        integrity="sha512-rijIQfP2KYlfTjFMjJg33a5fVUsZbLsy6fLSCZsM1jNI35n4xl1cBiIjxK5tANQYPWqa1niMYK5lWn2CTSUPKw=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/matchbrackets.min.js"
        integrity="sha512-ynfHqOx3h/V0CDEdHKHdS4C0Kp5tcpILVbUOqNczDbRDiKqrMx3mONwyFHcMmOs43MMiGfD9gDjbvnQ5fOZxvw=="
        crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";

  // LocalStorage keys - one topic per key, "georrery.<topic>" naming.
  var GEOJSON_STORAGE_KEY = "georrery.geojson"; // editor contents
  var OVERLAY_STORAGE_KEY = "georrery.overlay"; // selected map overlay
  var VIEW_STORAGE_KEY = "georrery.view";       // last map position + zoom

  var EMPTY_GEOJSON_TEXT = JSON.stringify({ type: "FeatureCollection", features: [] }, null, 2);

  var map = L.map("map", {
    worldCopyJump: true,
    attributionControl: true
  }).setView([20, 0], 2);

  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    maxZoom: 17,
    attribution:
      'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
      '<a href="http://viewfinderpanoramas.org">SRTM</a> | ' +
      'Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> ' +
      '(<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
  }).addTo(map);

  var panel     = document.getElementById("panel");
  var panelBar  = document.getElementById("panel-bar");
  var statusEl  = document.getElementById("panel-status");
  var updateBtn = document.getElementById("update-btn");
  var neverMindBtn = document.getElementById("nevermind-btn");
  var textarea  = document.getElementById("geojson-input");
  var brand     = document.getElementById("brand");
  var dataLayer = null;
  var lastRendered = null;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle("error", !!isError);
  }

  function countFeatures(data) {
    if (data && data.type === "FeatureCollection" && Array.isArray(data.features)) {
      return data.features.length;
    }
    return 1;
  }

  function renderData(data) {
    if (dataLayer) {
      map.removeLayer(dataLayer);
      dataLayer = null;
    }
    dataLayer = L.geoJSON(data, {
      style: function () {
        return { color: "#0284c7", weight: 2, fillOpacity: 0.25 };
      },
      pointToLayer: function (_feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 6, color: "#0284c7", weight: 2, fillOpacity: 0.5
        });
      },
      onEachFeature: function (feature, layer) {
        wireGeomanSync(layer);
        var html = popupHtml(feature);
        if (html) { layer.bindPopup(html, { className: "feat-popup" }); }
      }
    }).addTo(map);
    rebuildTimeIndex();
    if (playbackOn) { setPlayback(true); } // rebuild playback from fresh layers
  }

  // ---- Keep the GeoJSON panel clear of the attribution bar ----
  // The attribution bar (bottom-right of the map) can wrap to several lines
  // on narrow screens or when overlay attributions are active, so measure it.
  (function watchAttribution() {
    var el = map.attributionControl.getContainer();
    var apply = function () {
      document.documentElement.style.setProperty(
        "--attribution-h", el.offsetHeight + "px");
    };
    apply();
    if (window.ResizeObserver) {
      new ResizeObserver(apply).observe(el);
    } else {
      window.addEventListener("resize", apply);
    }
  })();

  // ---- Remembered map view ----
  // Saved a few seconds after you stop moving - never live per-frame/pan-step.
  function saveView() {
    try {
      var c = map.getCenter();
      localStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify({
        lat: Math.round(c.lat * 1e5) / 1e5,
        lng: Math.round(c.lng * 1e5) / 1e5,
        zoom: map.getZoom()
      }));
    } catch (e) { /* ignore */ }
  }

  function restoreView() {
    try {
      var v = JSON.parse(localStorage.getItem(VIEW_STORAGE_KEY));
      if (v && isFinite(v.lat) && isFinite(v.lng) && isFinite(v.zoom)) {
        map.setView([v.lat, v.lng], Math.max(0, Math.min(17, Math.round(v.zoom))), { animate: false });
        return true;
      }
    } catch (e) { /* ignore */ }
    return false;
  }

  restoreView(); // no saved view yet? the constructor's world view stands

  var viewSaveTimer = null;
  map.on("moveend zoomend", function () {
    clearTimeout(viewSaveTimer);
    viewSaveTimer = setTimeout(saveView, 3000); // one write per settled view
  });

  // ---- Overlay selection (header drop-down, single choice) ----
  var OVERLAYS = {
    "wmt-hiking": {
      url: "https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-cycling": {
      url: "https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-mtb": {
      url: "https://tile.waymarkedtrails.org/mtb/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-skating": {
      url: "https://tile.waymarkedtrails.org/skating/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-riding": {
      url: "https://tile.waymarkedtrails.org/riding/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "wmt-winter": {
      url: "https://tile.waymarkedtrails.org/winter/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Routes: &copy; <a href='https://waymarkedtrails.org'>waymarkedtrails.org</a> (CC-BY-SA)"
    },
    "oseam-seamark": {
      url: "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", maxZoom: 18,
      attribution: "Sea marks: &copy; <a href='https://openseamap.org'>OpenSeaMap</a> contributors (CC-BY-SA)"
    }
  };
  var overlaySelect = document.getElementById("overlay-select");
  var activeOverlay = null;

  function setOverlay(id) {
    if (activeOverlay) {
      map.removeLayer(activeOverlay);
      activeOverlay = null;
    }
    var def = OVERLAYS[id];
    if (def) {
      activeOverlay = L.tileLayer(def.url, {
        maxZoom: def.maxZoom,
        opacity: 0.9,
        attribution: def.attribution
      }).addTo(map);
    }
    try { localStorage.setItem(OVERLAY_STORAGE_KEY, id || ""); } catch (e) { /* ignore */ }
  }

  overlaySelect.addEventListener("change", function () {
    setOverlay(overlaySelect.value);
  });

  (function restoreOverlay() {
    var saved = "";
    try { saved = localStorage.getItem(OVERLAY_STORAGE_KEY) || ""; } catch (e) { /* ignore */ }
    if (!OVERLAYS[saved]) { saved = ""; }
    overlaySelect.value = saved;
    if (saved) { setOverlay(saved); }
  })();

  function parseEditor() {
    var text = editorValue();
    try {
      return { ok: true, data: JSON.parse(text), text: text };
    } catch (e) {
      return { ok: false, error: e.message, text: text };
    }
  }

  function refreshStatus() {
    var r = parseEditor();
    var dirty = r.text !== lastRendered;
    updateBtn.classList.toggle("show", dirty);
    neverMindBtn.classList.toggle("show", dirty);
    updateBtn.disabled = !r.ok;
    if (!r.ok) {
      setStatus("Invalid JSON: " + r.error, true);
      return;
    }
    var n = countFeatures(r.data);
    setStatus(n + " feature" + (n === 1 ? "" : "s") + (dirty ? " \u00b7 unsaved" : " rendered"), false);
  }

  function saveNow() {
    try { localStorage.setItem(GEOJSON_STORAGE_KEY, editorValue()); } catch (e) { /* storage full/unavailable */ }
  }

  var statusTimer = null;
  function scheduleStatusRefresh() {
    // live validation only - the text itself saves exclusively via "Update"
    clearTimeout(statusTimer);
    statusTimer = setTimeout(refreshStatus, 300);
  }

  // ---- Temporal features: fuzzy-date popups, range filter, playback ----
  // Time lives in properties as ISO 8601 / EDTF strings: "datetime" for an
  // instant ("1920", "2020-03~") or "start"/"end" for a range ("../.." open
  // bounds allowed). RFC 7946 lets properties hold arbitrary JSON; EDTF is
  // the Library of Congress fuzzy-date spec (ISO 8601-2 profile).
  var MIN_MS = -62135596800000;  // year 1
  var MAX_MS = 253402300799999;  // year 9999
  var timeIndex = null;
  var playbackOn = false;
  var tlLayer = null;
  var tlControl = null;
  var timeUI = {};
  var timeFilter = { lo: MIN_MS, hi: MAX_MS };

  // Level-0 fallback: "YYYY", "YYYY-MM", "YYYY-MM-DD" and "a/b" intervals.
  function basicEdtfBounds(s) {
    s = String(s).trim();
    var one = function (t) {
      var m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(t);
      if (!m) { return null; }
      var y = +m[1];
      if (!m[2]) { return { min: Date.UTC(y, 0, 1), max: Date.UTC(y, 11, 31, 23, 59, 59, 999) }; }
      if (!m[3]) { return { min: Date.UTC(y, m[2] - 1, 1), max: Date.UTC(y, m[2], 0, 23, 59, 59, 999) }; }
      var ms = Date.UTC(y, m[2] - 1, m[3]);
      return { min: ms, max: ms + 86399999 };
    };
    var parts = s.split("/");
    if (parts.length === 1) { return one(parts[0]); }
    var a = (parts[0] === "" || parts[0] === "..") ? null : one(parts[0]);
    var b = (parts[1] === "" || parts[1] === "..") ? null : one(parts[1]);
    if (!a && !b) { return null; }
    return { min: a ? a.min : -Infinity, max: b ? b.max : Infinity };
  }

  var parseEdtf = basicEdtfBounds;

  // Upgrade to full EDTF (fuzzy "2020~", "200X", "?" uncertainty, ...) when
  // the library is reachable; the fallback parser keeps the app usable offline.
  import("https://cdn.jsdelivr.net/npm/edtf@4/+esm")
    .then(function (mod) {
      var edtf = mod.default || mod.edtf;
      if (typeof edtf !== "function") { return; }
      parseEdtf = function (s) {
        try {
          var d = edtf(String(s));
          if (!d || d.min == null || d.max == null) { return null; }
          return { min: +d.min, max: +d.max };
        } catch (e) { return null; }
      };
      rebuildTimeIndex();   // re-index with full fuzz support
      if (playbackOn) { setPlayback(true); }
    })
    .catch(function () { /* keep the fallback parser */ });

  function clampMs(v, fallback) {
    if (v === -Infinity || v < MIN_MS) { return MIN_MS; }
    if (v === Infinity || v > MAX_MS) { return MAX_MS; }
    return isFinite(v) ? v : fallback;
  }

  function featureInterval(props) {
    var one = function (v) {
      if (v == null || v === "") { return null; }
      if (typeof v === "number" && isFinite(v)) { return { min: v, max: v }; }
      var r = parseEdtf(v);
      return r ? { min: clampMs(r.min, r.min), max: clampMs(r.max, r.max) } : null;
    };
    var a = one(props.datetime);
    if (a) { return a; }
    var s = one(props.start);
    var e = one(props.end);
    if (!s && !e) { return null; }
    return {
      min: s ? s.min : (e ? e.min : MIN_MS),
      max: e ? e.max : (s ? s.max : MAX_MS)
    };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function describeTimeRaw(p) {
    var bits = [];
    if (p.datetime) { bits.push(String(p.datetime)); }
    if (p.start || p.end) { bits.push(String(p.start || "...") + " - " + String(p.end || "...")); }
    return bits.join(" | ");
  }

  function popupHtml(feature) {
    var p = (feature && feature.properties) || {};
    var html = "";
    if (p.name) { html += "<strong>" + escapeHtml(String(p.name)) + "</strong>"; }
    var t = describeTimeRaw(p);
    if (t) { html += (html ? "<br>" : "") + '<span class="popup-time">' + escapeHtml(t) + "</span>"; }
    return html;
  }

  function setVisible(layer, visible) {
    if (layer.getLayers) {          // Multi* geometries arrive as groups
      layer.getLayers().forEach(function (l) { setVisible(l, visible); });
      return;
    }
    if (layer.getElement) {
      var el = layer.getElement();
      if (el) { el.style.display = visible ? "" : "none"; }
    }
  }

  function formatMs(ms) {
    if (!isFinite(ms)) { return "..."; }
    var d = new Date(ms);
    var span = timeIndex ? timeIndex.max - timeIndex.min : 0;
    if (span > 3 * 366 * 864e5) { return String(d.getUTCFullYear()); }
    return d.toISOString().slice(0, 10);
  }

  function sliderToMs(v) {
    return timeIndex.min + (v / 1000) * (timeIndex.max - timeIndex.min);
  }

  function updateTimeFilterUI() {
    if (!timeIndex || !timeIndex.items.length || !timeUI.card) { return; }
    var lo = sliderToMs(+timeUI.lo.value);
    var hi = sliderToMs(+timeUI.hi.value);
    timeFilter.lo = lo;
    timeFilter.hi = hi;
    var span = Math.max(1, timeIndex.max - timeIndex.min);
    timeUI.fill.style.left = (100 * (lo - timeIndex.min) / span) + "%";
    timeUI.fill.style.right = (100 - 100 * (hi - timeIndex.min) / span) + "%";
    timeUI.loLabel.textContent = formatMs(lo);
    timeUI.hiLabel.textContent = formatMs(hi);
    applyTimeFilter();
  }

  function onLoInput() {
    if (+timeUI.lo.value > +timeUI.hi.value) { timeUI.lo.value = timeUI.hi.value; }
    updateTimeFilterUI();
  }

  function onHiInput() {
    if (+timeUI.hi.value < +timeUI.lo.value) { timeUI.hi.value = timeUI.lo.value; }
    updateTimeFilterUI();
  }

  function applyTimeFilter() {
    if (!timeIndex) { return; }
    dataLayer.getLayers().forEach(function (layer) {
      var iv = timeIndex.byLayer.get(layer);
      var visible = true;
      if (iv) {
        // during playback the timeline layer owns the temporal features
        visible = playbackOn ? false : (iv.min <= timeFilter.hi && iv.max >= timeFilter.lo);
      }
      setVisible(layer, visible);
    });
  }

  function rebuildTimeIndex() {
    var prevMin = timeIndex ? timeIndex.min : null;
    var prevMax = timeIndex ? timeIndex.max : null;
    timeIndex = { items: [], byLayer: new Map(), min: Infinity, max: -Infinity };
    if (!dataLayer) { return; }
    dataLayer.getLayers().forEach(function (layer) {
      var f = layer.feature || null;
      var iv = f ? featureInterval(f.properties || {}) : null;
      timeIndex.byLayer.set(layer, iv);
      if (f && iv) {
        f.__interval = iv;
        timeIndex.items.push({ layer: layer, feature: f, interval: iv });
        if (iv.min < timeIndex.min) { timeIndex.min = iv.min; }
        if (iv.max > timeIndex.max) { timeIndex.max = iv.max; }
      }
    });
    var has = timeIndex.items.length > 0;
    timeUI.card.style.display = has ? "" : "none";
    if (has) {
      if (timeIndex.min !== prevMin || timeIndex.max !== prevMax) {
        timeUI.lo.value = 0;      // domain changed -> reset the filter window
        timeUI.hi.value = 1000;
      }
      updateTimeFilterUI();
    } else if (playbackOn) {
      setPlayback(false);
    }
  }

  function setPlayback(on) {
    playbackOn = on;
    if (tlControl) { map.removeControl(tlControl); tlControl = null; }
    if (tlLayer) { map.removeLayer(tlLayer); tlLayer = null; }
    if (on && timeIndex && timeIndex.items.length) {
      var fc = {
        type: "FeatureCollection",
        features: timeIndex.items.map(function (it) { return it.feature; })
      };
      tlLayer = L.timeline(fc, {
        pmIgnore: true,           // keep Geoman off the playback copies
        getInterval: function (f) {
          return f.__interval ? { start: f.__interval.min, end: f.__interval.max } : false;
        },
        style: function () { return { color: "#7c3aed", weight: 2, fillOpacity: 0.25 }; },
        pointToLayer: function (_feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 6, color: "#7c3aed", weight: 2, fillOpacity: 0.5
          });
        },
        onEachFeature: function (feature, layer) {
          var html = popupHtml(feature);
          if (html) { layer.bindPopup(html, { className: "feat-popup" }); }
        }
      });
      tlControl = L.timelineSliderControl({
        position: "topright",
        formatOutput: formatMs,
        autoPlay: false
      });
      tlLayer.addTo(map);
      tlControl.addTo(map);
      tlControl.addTimelines(tlLayer);
    }
    timeUI.playBtn.textContent = on ? "Playback: on" : "Playback: off";
    timeUI.playBtn.classList.toggle("active", on);
    applyTimeFilter();
  }

  var TimeFilterControl = L.Control.extend({
    options: { position: "topright" },
    onAdd: function () {
      var root = L.DomUtil.create("div", "time-card");
      root.style.display = "none";
      root.innerHTML =
        '<div class="time-head"><span>Time filter</span>' +
        '<button type="button" class="playback-toggle">Playback: off</button></div>' +
        '<div class="range-stack">' +
        '<div class="range-track"></div><div class="range-fill"></div>' +
        '<input type="range" min="0" max="1000" value="0" aria-label="Filter start time">' +
        '<input type="range" min="0" max="1000" value="1000" aria-label="Filter end time">' +
        "</div>" +
        '<div class="time-labels"><span class="lo-label"></span><span class="hi-label"></span></div>';
      timeUI.card = root;
      timeUI.lo = root.querySelectorAll("input")[0];
      timeUI.hi = root.querySelectorAll("input")[1];
      timeUI.fill = root.querySelector(".range-fill");
      timeUI.loLabel = root.querySelector(".lo-label");
      timeUI.hiLabel = root.querySelector(".hi-label");
      timeUI.playBtn = root.querySelector(".playback-toggle");
      timeUI.lo.addEventListener("input", onLoInput);
      timeUI.hi.addEventListener("input", onHiInput);
      timeUI.playBtn.addEventListener("click", function () { setPlayback(!playbackOn); });
      L.DomEvent.disableClickPropagation(root);
      L.DomEvent.disableScrollPropagation(root);
      return root;
    }
  });
  map.addControl(new TimeFilterControl());

  // Load persisted GeoJSON (or a sample) into the textarea before CM takes over.
  var saved = null;
  try { saved = localStorage.getItem(GEOJSON_STORAGE_KEY); } catch (e) { /* ignore */ }
  textarea.value = (saved !== null && saved !== "")
    ? saved
    : EMPTY_GEOJSON_TEXT;

  // CodeMirror, with a plain-textarea fallback if the CDN library fails to load.
  var cm = null;
  var editorValue;

  if (typeof CodeMirror !== "undefined") {
    cm = CodeMirror.fromTextArea(textarea, {
      mode: "application/json",
      lineNumbers: true,
      matchBrackets: true,
      autoCloseBrackets: true,
      lint: true,
      indentUnit: 2,
      tabSize: 2,
      gutters: ["CodeMirror-lint-markers", "CodeMirror-linenumbers"]
    });
    editorValue = function () { return cm.getValue(); };
  } else {
    editorValue = function () { return textarea.value; };
    setStatus("CodeMirror CDN failed to load - plain text mode", true);
  }

  lastRendered = editorValue();

  var r = parseEditor();
  if (r.ok) { renderData(r.data); }
  refreshStatus();

  function onEdit() {
    if (syncingFromMap) { return; } // map-originated; syncMapToText owns the state
    var dirty = editorValue() !== lastRendered;
    updateBtn.classList.toggle("show", dirty);
    neverMindBtn.classList.toggle("show", dirty);
    scheduleStatusRefresh();
  }

  if (cm) { cm.on("change", onEdit); }
  else { textarea.addEventListener("input", onEdit); }

  updateBtn.addEventListener("click", function (e) {
    e.stopPropagation(); // don't toggle the panel
    var res = parseEditor();
    if (!res.ok) {
      setStatus("Invalid JSON: " + res.error, true);
      return;
    }
    renderData(res.data);
    lastRendered = res.text;
    clearTimeout(statusTimer);
    saveNow();
    refreshStatus();
    if (cm) { cm.focus(); } else { textarea.focus(); }
  });

  neverMindBtn.addEventListener("click", function (e) {
    e.stopPropagation(); // don't toggle the panel
    var saved = null;
    try { saved = localStorage.getItem(GEOJSON_STORAGE_KEY); } catch (err) { /* ignore */ }
    var text = (saved !== null && saved !== "") ? saved : EMPTY_GEOJSON_TEXT;
    syncingFromMap = false;
    if (cm) { cm.setValue(text); } else { textarea.value = text; }
    clearTimeout(statusTimer);
    if (text !== lastRendered) {
      // storage and the editor disagree with what is drawn (e.g. right after
      // a Reset) - bring the map back in line with the restored text
      var res = parseEditor();
      if (res.ok) { renderData(res.data); }
    }
    lastRendered = text;
    refreshStatus();
    if (cm) { cm.focus(); } else { textarea.focus(); }
  });

  // The panel is anchored bottom-left: a small pill when collapsed, full
  // width when open. Collapsed size is fit-content, which CSS can't animate,
  // so expand/collapse pin an explicit start width, then release it to let
  // the transition run to the class-driven target.
  var widthAnimHandler = null;

  function stopWidthAnim() {
    if (widthAnimHandler) {
      panel.removeEventListener("transitionend", widthAnimHandler);
      widthAnimHandler = null;
    }
  }

  function expandPanel() {
    stopWidthAnim();
    var w0 = panel.offsetWidth;            // current pill (or mid-anim) width
    panel.classList.add("open");
    panel.style.height = "";               // release any pinned height
    panel.style.width = w0 + "px";         // pin start width
    void panel.offsetWidth;                // commit the start state
    panel.style.width = "";                // release -> animates to full width
  }

  function collapsePanel() {
    stopWidthAnim();
    var w0 = panel.offsetWidth;            // current full width
    var h0 = panel.offsetHeight;
    panel.style.width = w0 + "px";         // pin both at current size
    panel.style.height = h0 + "px";
    panel.style.transition = "none";
    panel.classList.remove("open");
    panel.style.width = "auto";            // measure the collapsed pill size
    var w1 = panel.offsetWidth;
    panel.style.width = w0 + "px";         // back to the pinned start state
    panel.style.height = h0 + "px";
    void panel.offsetWidth;
    panel.style.transition = "";           // re-enable transitions
    panel.style.width = w1 + "px";         // width: full -> pill
    panel.style.height = "";               // height: current -> 46px
    widthAnimHandler = function (e) {
      if (e.propertyName !== "width") { return; }
      panel.style.width = "";              // hand control back to CSS
      panel.removeEventListener("transitionend", widthAnimHandler);
      widthAnimHandler = null;
    };
    panel.addEventListener("transitionend", widthAnimHandler);
  }

  function openPanel() {
    if (!panel.classList.contains("open")) { expandPanel(); }
    setTimeout(function () { if (cm) { cm.refresh(); } }, 320); // after transition
    if (cm) { cm.focus(); } else { textarea.focus(); }
  }

  panelBar.addEventListener("click", function () {
    if (panel.classList.contains("open")) {
      collapsePanel();
    } else {
      openPanel();
    }
  });

  // ---- Header menu: brand click slides the name right, revealing buttons ----
  var header = document.querySelector("header");
  brand.addEventListener("click", function () {
    header.classList.toggle("menu-open");
  });

  function resetAll() {
    try { localStorage.clear(); } catch (e) { /* ignore */ }
    if (activeOverlay) {                    // overlay state lived in storage
      map.removeLayer(activeOverlay);
      activeOverlay = null;
      overlaySelect.value = "";
    }
    // Wipe the text but leave lastRendered untouched: the map (and storage)
    // keep the old features until the user confirms with "Update".
    syncingFromMap = false;
    if (cm) { cm.setValue(EMPTY_GEOJSON_TEXT); } else { textarea.value = EMPTY_GEOJSON_TEXT; }
    refreshStatus();
    openPanel();
  }

  document.getElementById("reset-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    resetAll();
    header.classList.remove("menu-open");
  });

  if (cm) {
    // Keep Leaflet keyboard shortcuts from firing while typing in the editor.
    ["keydown", "keyup", "keypress"].forEach(function (type) {
      cm.getWrapperElement().addEventListener(type, function (e) {
        e.stopPropagation();
      });
    });
  }

  // ---- Graphical drawing/editing (Leaflet-Geoman) ----
  // Map changes are the same data as the text, so they sync straight back into
  // the editor + LocalStorage without needing the Update button.
  var mapSyncTimer = null;
  var syncingFromMap = false;

  function addSerialized(layer) {
    // a cut can produce a LayerGroup of several pieces - flatten it
    if (layer instanceof L.LayerGroup) {
      layer.getLayers().forEach(function (l) { dataLayer.addLayer(l); });
    } else {
      dataLayer.addLayer(layer);
    }
  }

  function pruneRemoved() {
    dataLayer.getLayers().slice().forEach(function (layer) {
      if (!map.hasLayer(layer)) { dataLayer.removeLayer(layer); }
    });
  }

  function syncMapToText() {
    if (!dataLayer) { return; }
    pruneRemoved();
    var text = JSON.stringify(dataLayer.toGeoJSON(), null, 2);
    syncingFromMap = true;
    if (cm) { cm.setValue(text); } else { textarea.value = text; }
    syncingFromMap = false;
    lastRendered = text;
    saveNow();
    refreshStatus();
    rebuildTimeIndex(); // cuts/removals change the layer set behind the map's back
  }

  function scheduleMapSync() {
    clearTimeout(mapSyncTimer);
    mapSyncTimer = setTimeout(syncMapToText, 400);
  }

  // pm:edit / pm:dragend / pm:rotateend are LAYER events in Geoman (only
  // create/cut/remove fire on the map), so every feature gets its own listeners.
  function wireGeomanSync(layer) {
    if (layer.getLayers) {
      layer.getLayers().forEach(function (l) { wireGeomanSync(l); });
      return;
    }
    layer.on("pm:edit pm:dragend pm:rotateend", scheduleMapSync);
  }

  if (map.pm) {
    map.pm.addControls({
      position: "topleft",
      drawMarker: true,
      drawPolyline: true,
      drawPolygon: true,
      drawRectangle: true,
      drawCircle: false,  // circles don't round-trip to valid GeoJSON
      drawText: false,
      editMode: true,
      dragMode: true,
      rotateMode: true,
      cutPolygon: true,
      removalMode: true
    });

    map.on("pm:create", function (e) { addSerialized(e.layer); wireGeomanSync(e.layer); scheduleMapSync(); });
    map.on("pm:cut", function (e) { addSerialized(e.layer); wireGeomanSync(e.layer); scheduleMapSync(); });
    map.on("pm:remove", scheduleMapSync);
  } else {
    setStatus("Geoman CDN failed to load - drawing disabled", true);
  }

  window.addEventListener("pagehide", function () {
    clearTimeout(statusTimer);
    clearTimeout(viewSaveTimer);
    saveView(); // unsaved text edits are intentionally discarded
  });
})();
</script>
</body>
</html>
